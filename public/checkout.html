<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Secure checkout · Digital Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
  .co-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px;gap:14px}
  .co{width:min(480px,100%)}
  .co-foot{font-size:.75rem;color:var(--faint);text-align:center}
  .tc{display:flex;flex-direction:column;gap:6px}
  .cap-brand{display:flex;align-items:center;gap:10px;font-weight:800}
  .cap-logo{width:34px;height:34px;border-radius:9px;background:#00D64F;color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.15rem}
  .cap-btn{background:#00D64F;border-color:#00D64F;color:#fff;width:100%;padding:13px;font-size:1rem}
  .cap-btn:hover{filter:brightness(1.05);border-color:#00D64F}
  .cap-qr{background:#fff;border-radius:12px;padding:12px;width:204px;height:204px;display:grid;place-items:center;margin:0 auto}
  .cap-qr img,.cap-qr canvas{width:180px!important;height:180px!important}
  .waiting{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:.86rem}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:dh-pulse 1.2s infinite ease-in-out}
  @keyframes dh-pulse{0%,100%{opacity:.25}50%{opacity:1}}
  .thank-you{display:grid;justify-items:center;gap:12px;text-align:center;padding:8px 0}
  .thank-you-mark{width:64px;height:64px;display:grid;place-items:center;border-radius:50%;background:var(--ok-soft);color:var(--ok);font-size:2rem;font-weight:800;animation:dh-pop .55s cubic-bezier(.2,.8,.2,1) both}
  .thank-you-mark span{animation:dh-check .35s .2s ease-out both}
  .thank-you-details{width:100%;margin:8px 0;padding:4px 14px;border:1px solid var(--line);border-radius:var(--r-md);text-align:left}
  .thank-you-details>div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
  .thank-you-details>div:last-child{border-bottom:0}
  .thank-you-details span{color:var(--muted)}
  .thank-you-details b{text-align:right;overflow-wrap:anywhere}
  .thank-you-details .paid-status{text-transform:capitalize;color:var(--ok)}
  .thank-you-reference{flex-wrap:wrap}
  @keyframes dh-pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes dh-check{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  @media(prefers-reduced-motion:reduce){.thank-you-mark,.thank-you-mark span{animation:none}}
</style>
</head>
<body>
<div id="banner"></div>
<div class="co-page"><div class="co" id="co"><div class="co-body"><div class="loading">Loading checkout…</div></div></div>
  <div class="co-foot">Secured by Digital Hub · <span id="modeNote"></span></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/checkout.js"></script>
</body>
</html>
