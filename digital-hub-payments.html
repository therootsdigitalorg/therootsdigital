<script>
/* ---------------- 7e. Hosted checkout (customer view) ---------------- */
function checkoutState(){ return UI.checkout ||= { linkId:null, sessId:null, method:'card', step:'form', customer:{ name:'Maya Chen', email:'maya.chen@example.com', country:'US' }, asset:null, network:null, errors:{}, otpTries:0 }; }
function methodAvailable(m, x){
  if(x==='card') return m.cardEnabled && m.perms.card && mProv(m,'acq_sim')==='approved' && provOn('acq_sim');
  return m.perms.crypto && mProv(m,m.cryptoProvider)==='approved' && provOn(m.cryptoProvider) && cryptoOptions(m).length>0;
}
function startCheckout({ linkId=null, mid, amount, currency, description }){
  stopTimers();
  const st = checkoutState();
  Object.assign(st, { linkId, sessId:null, step:'form', method:'card', paymentId:null, errors:{}, otpTries:0, asset:null, network:null, blocked:null });
  const m = merchant(mid);
  if(m.kyb!=='approved'){ st.blocked = `${m.name} is not approved to accept payments yet (status: ${m.kyb}).`; return; }
  const s = Payments.createSession({ mid, amount, currency, description, linkId });
  st.sessId = s.id;
  st.method = methodAvailable(m,'card') ? 'card' : 'crypto';
  const link = linkId && S.links.find(l => l.id===linkId);
  if(link && !link.methods.includes(st.method)) st.method = link.methods[0];
}
const curSession = () => S.sessions.find(s => s.id===checkoutState().sessId);
function stopTimers(){ clearInterval(UI.coTimer); UI.coTimer = null; }

VIEWS.checkout = () => {
  const st = checkoutState();
  if(!st.sessId && !st.blocked){ const l = S.links.find(x => x.mid==='m_northwind' && linkStatus(x)==='active'); if(l) startCheckout({ linkId:l.id, mid:l.mid, amount:l.amount, currency:l.currency, description:l.description }); }
  const merchants = S.merchants;
  return head('Customer view','Hosted checkout','What a customer sees after opening a payment link. Card fields are provider-hosted; crypto addresses and Binance Pay QR codes come from the provider. Everything here is simulated.')
   + `<div class="co-wrap">
      <div class="stack">
        <div class="card stack"><h2>Start a checkout</h2>
          <label class="field"><span>Payment link</span><select id="co-link">${S.links.map(l => `<option value="${l.id}" ${st.linkId===l.id?'selected':''}>${esc(merchant(l.mid).name)} · ${esc(l.description)} · ${fmt(l.amount,l.currency)} (${linkStatus(l)})</option>`).join('')}</select></label>
          <button class="btn" data-act="coOpenSelected">Open this link</button>

        </div>

    </div>`;
};
VIEW_MOUNT.checkout = () => { mountCheckoutWidget(); };
function renderWidget(){ const w = $('#coWidget'); if(w){ w.innerHTML = checkoutWidget(); mountCheckoutWidget(); } }

function checkoutWidget(){
  const st = checkoutState();
  if(st.blocked) return `<div class="co-body"><div class="result"><div class="icon" style="background:var(--warn-soft);color:var(--warn)">!</div><h2>Checkout unavailable</h2><p class="muted">${esc(st.blocked)}</p></div></div>`;
  const s = curSession(); if(!s) return `<div class="co-body empty">Choose a payment link to begin.</div>`;
  const m = merchant(s.mid), link = s.linkId && S.links.find(l => l.id===s.linkId);
  const top = `<div class="co-top"><div><div class="eyebrow" style="color:var(--muted)">${esc(m.name)}</div><div class="co-amt">${fmt(s.amount,s.currency)}</div><div class="muted">${esc(s.description)}</div></div><span class="tag">TEST</span></div>`;
  if(m.kyb!=='approved' && !st.paymentId) return top + `<div class="co-body"><div class="result"><div class="icon" style="background:var(--warn-soft);color:var(--warn)">!</div><h2>Checkout unavailable</h2><p class="muted">${esc(m.name)} cannot accept payments right now.</p></div></div>`;
  if(link && linkStatus(link)!=='active' && !st.paymentId) return top + `<div class="co-body"><div class="result"><div class="icon" style="background:var(--neutral-soft);color:var(--muted)">×</div><h2>This link is ${esc(linkStatus(link))}</h2><p class="muted">Ask ${esc(m.name)} for a new payment link.</p></div></div>`;
  const methods = (link?link.methods:['card','crypto']).filter(x => methodAvailable(m, x));
  if(methods.length && !methods.includes(st.method)) st.method = methods[0];
  const p = st.paymentId && pay(st.paymentId);
  let body = '';
  if(st.step==='result' && p) body = resultPanel(p);
  else if(st.step==='challenge') body = challengePanel();
  else if(st.step==='processing') body = `<div class="result"><div class="icon" style="background:var(--info-soft);color:var(--info)">…</div><h2>Processing</h2><p class="muted">Contacting the acquirer. Do not refresh.</p></div>`;
  else if(st.step==='crypto_pay' && p) body = cryptoPayPanel(p);
  else if(!methods.length) body = `<div class="note warn"><span>No payment method is currently available for ${esc(m.name)}. Provider authorization or permissions are pending at Digital Hub.</span></div>`;
  else {
    body = `<div class="methods" role="group" aria-label="Payment method">${methods.map(x => `<button type="button" data-act="coMethod" data-m="${x}" aria-pressed="${st.method===x}">${x==='card'?'Card':'USDT / USDC'}<small>${x==='card'?'Visa · Mastercard':m.cryptoProvider==='binance'?'Binance Pay':'Stablecoin transfer'}</small></button>`).join('')}</div>
      ${customerFields(st)}
      ${st.method==='card' ? cardForm(st) : cryptoSelect(st, m, s)}`;
  }
  return top + `<div class="co-body">${body}</div><div class="co-body" style="border-top:1px solid var(--line);padding-block:10px"><span class="faint" style="font-size:.75rem">Powered by Digital Hub · simulated sandbox · no real funds move</span></div>`;
}
function customerFields(st){
  const e = st.errors;
  return `<div class="form-grid">
    <label class="field"><span>Full name</span><input type="text" id="co-name" value="${esc(st.customer.name)}" autocomplete="name" class="${e.name?'invalid':''}">${e.name?`<span class="err">${e.name}</span>`:''}</label>
    <label class="field"><span>Email for receipt</span><input type="email" id="co-email" value="${esc(st.customer.email)}" autocomplete="email" class="${e.email?'invalid':''}">${e.email?`<span class="err">${e.email}</span>`:''}</label>
    <label class="field full"><span>Billing country</span><select id="co-country">${Object.entries(CONFIG.countries).map(([k,v]) => `<option value="${k}" ${st.customer.country===k?'selected':''}>${v}</option>`).join('')}</select></label></div>`;
}
function cardForm(st){
  const e = st.errors, c = st.cardDraft || {};
  return `<div class="hosted"><div class="hosted-label"><span>Secure card fields</span><span>hosted by acquirer · simulated</span></div>
    <label class="field"><span>Card number</span><input type="text" id="co-num" inputmode="numeric" autocomplete="cc-number" placeholder="1234 1234 1234 1234" value="${esc(c.num||'')}" class="${e.num?'invalid':''}">${e.num?`<span class="err">${e.num}</span>`:''}</label>
    <div class="form-grid"><label class="field"><span>Expiry (MM/YY)</span><input type="text" id="co-exp" inputmode="numeric" placeholder="MM/YY" value="${esc(c.exp||'')}" class="${e.exp?'invalid':''}">${e.exp?`<span class="err">${e.exp}</span>`:''}</label>
    <label class="field"><span>CVC</span><input type="password" id="co-cvc" inputmode="numeric" maxlength="4" placeholder="123" value="${esc(c.cvc||'')}" class="${e.cvc?'invalid':''}">${e.cvc?`<span class="err">${e.cvc}</span>`:''}</label></div></div>
    ${e.form?`<div class="note danger"><span>${esc(e.form)}</span></div>`:''}
    <button class="btn primary" style="width:100%;padding:12px" data-act="coPayCard" id="payBtn">Pay ${fmt(curSession().amount, curSession().currency)}</button>`;
}
function cryptoOptions(m){
  const opts = [];
  for(const [a, nets] of Object.entries(m.acceptedCrypto)) for(const n of nets) if(S.platform.networksEnabled[n] && CryptoAdapters[m.cryptoProvider].networks.includes(n)) opts.push([a,n]);
  return opts;
}
function cryptoSelect(st, m, s){
  const opts = cryptoOptions(m);
  if(!opts.length) return `<div class="note warn"><span>This merchant has no stablecoin networks enabled.</span></div>`;
  const assets = [...new Set(opts.map(o => o[0]))];
  if(!st.asset || !assets.includes(st.asset)) st.asset = assets[0];
  const nets = opts.filter(o => o[0]===st.asset).map(o => o[1]);
  if(!st.network || !nets.includes(st.network)) st.network = nets[0];

function mountCheckoutWidget(){
  const st = checkoutState(), p = st.paymentId && pay(st.paymentId);
  if(st.step==='crypto_pay' && p){ qrInto($('#coQr'), $('#coUri')?.textContent || p.crypto.address); ensureTimer(); }
  const fmtNum = $('#co-num'); if(fmtNum) fmtNum.addEventListener('input', () => { const d = fmtNum.value.replace(/\D/g,'').slice(0,19); fmtNum.value = d.replace(/(.{4})/g,'$1 ').trim(); });
  const ex = $('#co-exp'); if(ex) ex.addEventListener('input', () => { let d = ex.value.replace(/\D/g,'').slice(0,4); ex.value = d.length>2 ? d.slice(0,2)+'/'+d.slice(2) : d; });

function ensureTimer(){
  if(UI.coTimer) return;
  UI.coTimer = setInterval(() => {
    const st = checkoutState(), p = st.paymentId && pay(st.paymentId);
    if(!p || st.step!=='crypto_pay' || UI.route!=='checkout'){ stopTimers(); return; }
    if(p.status==='awaiting_payment' && now() > p.crypto.expiresAt){ Payments.cryptoExpire(p); st.step='result'; save(); renderWidget(); stopTimers(); return; }
    if(p.status==='confirming'){
      Payments.cryptoConfirmTick(p); save();
      if(!['confirming'].includes(p.status)){ if(p.status!=='underpaid') st.step='result'; afterPaid(p); stopTimers(); renderWidget(); renderRail(); return; }
      renderWidget(); return;
    }
    const cd = $('#coCountdown'); if(cd && p.status==='awaiting_payment'){ const left = Math.max(0,p.crypto.expiresAt-now()); cd.textContent = `Quote expires in ${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left%60000/1000)).padStart(2,'0')}`; }
  }, 700);
}
function afterPaid(p){
  const l = p.linkId && S.links.find(x => x.id===p.linkId);
  if(l && ['captured','authorized','confirmed','overpaid'].includes(p.status) && !l.payments.includes(p.id)){ l.payments.push(p.id); if(!l.reusable) l.status='paid'; }
}
function readCustomer(){
  const st = checkoutState();
  st.customer = { name:$('#co-name').value.trim(), email:$('#co-email').value.trim(), country:$('#co-country').value };
  st.errors = {};
  if(st.customer.name.length<2) st.errors.name = 'Enter the cardholder or payer name.';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(st.customer.email)) st.errors.email = 'Enter a valid email address.';
  return !st.errors.name && !st.errors.email;
}

    }
    if(tab==='pricing'){
      body += permNote('merchants.pricing') + `<form class="form-grid" data-form="fees" data-id="${m.id}">

      <label class="field"><span>FX spread (bps)</span><input type="number" step="1" min="0" name="spread" id="fee-sp" value="${m.fees.fxSpreadBps}"></label>
      <label class="field"><span>Dispute fee (USD)</span><input type="number" step="0.01" min="0" name="disputeFee" value="${(m.fees.disputeFeeUSD/100).toFixed(2)}"></label>
      <label class="field"><span>Rolling reserve %</span><input type="number" step="0.5" min="0" max="30" name="resPct" id="fee-rp" value="${m.reserve.pct}"></label>
      <label class="field"><span>Reserve days</span><input type="number" step="1" min="0" name="resDays" id="fee-rd" value="${m.reserve.days}"></label>
      <button class="btn full" type="submit">Save pricing (applies to new payments)</button><div class="err full" id="formErr"></div></form>`;
    }
    let foot = '';
    const ready = kybReady(m);
    if(m.kyb==='pending') foot = `<button class="btn danger" data-act="kyb" data-id="${m.id}" data-to="rejected">Reject</button><button class="btn primary" data-act="kyb" data-id="${m.id}" data-to="approved" ${ready?'':'disabled title="Complete KYB, KYC and AML first"'}>Approve merchant</button>`;
    else if(m.kyb==='approved') foot = `<button class="btn danger" data-act="kyb" data-id="${m.id}" data-to="suspended">Suspend</button>`;
    else if(m.kyb==='suspended') foot = `<button class="btn" data-act="kyb" data-id="${m.id}" data-to="pending">Reopen review</button><button class="btn primary" data-act="kyb" data-id="${m.id}" data-to="approved" ${ready?'':'disabled'}>Reactivate</button>`;
    else foot = `<button class="btn" data-act="kyb" data-id="${m.id}" data-to="pending">Reopen review</button>`;
    return { title:m.name, body, foot };
  };
}

function reconReport(){
  const out = {};
  const g = c => out[c] ||= { cur:c, receipts:0, provFees:0, commission:0, refunds:0, payouts:0, merchantLiab:0, custLiab:0, partner:0 };
  for(const p of S.payments){ if(!p.fees || p.status==='reversed') continue; const x = g(payCur(p)); x.receipts += payGross(p); x.provFees += p.fees.provider; x.commission += p.fees.platform; }
  for(const r of S.refunds) if(r.kind==='refund') g(r.cur).refunds += r.amount;
  for(const po of S.payouts) if(po.status==='completed') g(po.sourceCur).payouts += po.amount;
  for(const e of S.ledger){
    const x = g(e.cur);
    if(MERCHANT_ACCTS.includes(e.acct)) x.merchantLiab -= e.amt;
    if([ACCT.C_SUSPENSE, ACCT.C_OVERPAY].includes(e.acct)) x.custLiab -= e.amt;
    if([ACCT.P_CASH, ACCT.P_CUSTODY, ACCT.ACQ_RCV].includes(e.acct)) x.partner += e.amt;
  }
  return Object.values(out).sort((a,b)=>a.cur.localeCompare(b.cur));
}

function reconChecks(){
  const out = [];
  const tb = Ledger.trialBalance();
  out.push({ name:'Every journal balances', ok:Object.values(tb).every(t => t.debits===t.credits), detail:'Total debits equal total credits in every currency.' });
  const keys = S.ledger.map(e => e.key), jids = new Set(S.ledger.map(e=>e.jid));
  out.push({ name:'No duplicate postings', ok: jids.size === new Set(keys).size, detail:`${jids.size} journals, each with a unique idempotency key.` });
  const sumAcct = (acct, filter=()=>true) => { const t={}; for(const e of S.ledger) if(e.acct===acct && filter(e)) t[e.cur]=(t[e.cur]||0)+e.amt; return t; };
  const eq = (a,b) => { const ks = new Set([...Object.keys(a),...Object.keys(b)]); return [...ks].every(k => (a[k]||0)===(b[k]||0)); };
  const rcvExpected = {}; for(const p of S.payments) if(p.method==='card' && !p.settled && p.rcvRemaining) rcvExpected[p.currency]=(rcvExpected[p.currency]||0)+p.rcvRemaining;
  out.push({ name:'Acquirer receivable = unsettled captures', ok:eq(sumAcct(ACCT.ACQ_RCV), rcvExpected), detail:'Money owed by the acquirer matches captured card payments not yet settled.' });
  const susp = {}; for(const p of S.payments) if(p.crypto && ['confirming','underpaid'].includes(p.status)) susp[p.crypto.asset]=(susp[p.crypto.asset]||0)-p.crypto.received;
  out.push({ name:'Customer suspense = unconfirmed crypto', ok:eq(sumAcct(ACCT.C_SUSPENSE), susp), detail:'Funds detected but not yet confirmed or resolved are held outside merchant balances.' });
  const over = {}; for(const p of S.payments) if(p.crypto?.excess) over[p.crypto.asset]=(over[p.crypto.asset]||0)-p.crypto.excess;
  out.push({ name:'Overpayment liability = unreturned excess', ok:eq(sumAcct(ACCT.C_OVERPAY), over), detail:'Excess crypto owed back to customers.' });
  const hold = {}; for(const po of S.payouts) if(['pending_approval','held','processing'].includes(po.status)) hold[po.sourceCur]=(hold[po.sourceCur]||0)-po.amount;
  out.push({ name:'Payout holds = payouts in flight', ok:eq(sumAcct(ACCT.M_HOLD), hold), detail:'Funds on hold match payouts awaiting approval or sending.' });
  const pend = {}; for(const p of S.payments) if(p.method==='card' && !p.settled && p.pendingRemaining) pend[p.currency]=(pend[p.currency]||0)-p.pendingRemaining;
  out.push({ name:'Merchant pending = unsettled net', ok:eq(sumAcct(ACCT.M_PENDING), pend), detail:'Pending balances equal net of captured, unsettled card payments.' });
  const adj = {}; for(const a of S.adjustments) if(a.status==='posted') adj[a.cur]=(adj[a.cur]||0)+a.amt;
  out.push({ name:'Adjustments = approved maker-checker entries', ok:eq(sumAcct(ACCT.P_ADJ), adj), detail:'Every platform adjustment posting traces to an approved adjustment record.' });
  const neg = S.merchants.flatMap(m => Object.entries(Ledger.merchantBalances(m.id)).filter(([,b]) => b.available<0).map(([c]) => `${m.name} ${c}`));
  out.push({ name:'No negative available balances', ok:true, warn:neg.length>0, detail: neg.length ? 'Negative after chargebacks: '+neg.join(', ')+'. Recover from reserve or future settlements.' : 'All merchant available balances are zero or positive.' });
  return out;
}

const Inbound = {  // provider → Digital Hub webhook receiver (simulated)
  async handle(rawBody, sigHeader, secret){
    const [t, v1] = sigHeader.split(',').map(x => x.split('=')[1]);
    if(await hmacHex(secret, `${t}.${rawBody}`) !== v1) return { status:400, msg:'signature mismatch' };
    if(Math.abs(Date.now()/1000 - +t) > 300) return { status:400, msg:'timestamp outside replay window' };
    const evt = JSON.parse(rawBody);
    if(S.processedEvents[evt.id]) return { status:200, msg:'duplicate ignored' };
    S.processedEvents[evt.id] = Date.now(); return { status:200, msg:'processed' };
  },
};

    const sess = Payments.createSession({ mid:m.id, amount:10000, currency:'USD', description:'test' });
    T('Tampered amount is rejected', !Payments.verifySession(sess, 100, 'USD') && Payments.verifySession(sess, 10000, 'USD'), 'Client changed 100.00 → 1.00; the session signature no longer matches.');
    const secret = 'whsec_test_'+rid(8), body = JSON.stringify({ id:'evt_test_1', type:'payment.succeeded' }), ts = Math.floor(Date.now()/1000);
    const sig = await hmacHex(secret, `${ts}.${body}`);
    const bad = await Inbound.handle(body.replace('succeeded','failed'), `t=${ts},v1=${sig}`, secret);
    T('Forged webhook body is rejected', bad.status===400, `Body altered after signing → ${bad.status} ${bad.msg}.`);
    const r1 = await Inbound.handle(body, `t=${ts},v1=${sig}`, secret), r2 = await Inbound.handle(body, `t=${ts},v1=${sig}`, secret);
    T('Replayed webhook is processed once', r1.msg==='processed' && r2.msg==='duplicate ignored', `First delivery: ${r1.msg}; replay: ${r2.msg}.`);

    T('Unbalanced journal is refused', threw, 'A journal whose debits and credits differ by 0.01 throws before writing.');

    cp.crypto.expiresAt = now()-1000; Payments.cryptoExpire(cp); Payments.cryptoDetected(cp, cp.crypto.quoteAmount);
    T('Funds after quote expiry are not auto-credited', cp.status==='expired', 'Late transfer is left for manual handling instead of crediting at a stale rate.');
    const settled = S.payments.find(p => p.method==='card' && p.status==='settled');
    let t2=false; try{ Refunds.create(settled, settled.amount+1, { actor:'test' }); }catch{ t2=true; }

    T('Payout above available balance is refused', t3, 'A payout larger than the available balance never places a hold.');
    const keep = S.actingAdmin;
    S.actingAdmin = 'stf_mina'; const supportCan = can('payouts.approve');
    S.actingAdmin = 'stf_lena'; const financeCan = can('payouts.approve');

    let mc=false; try{ Adjustments.approve(adj, 'finance@digitalhub'); }catch{ mc=true; }
    Adjustments.approve(adj, 'super@digitalhub');

    T('Idempotency-Key replays the original result', !i1.replay && i2.replay && i2.resultId==='re_first' && conflict, 'Same key + same body → original refund; same key + different body → 422.');
    const card = { number:'5555555555554444', country:'US' };
    const n3a = decide3DS({ m:{ ...m, non3dsApproved:false, non3ds:null }, card, amount:1000, currency:'USD', risk:{ score:5 } });
    const n3b = decide3DS({ m:{ ...m, non3dsApproved:true, non3ds:null }, card, amount:1000, currency:'USD', risk:{ score:5 } });
    const n3c = decide3DS({ m, card, amount:1000, currency:'USD', risk:{ score:5 } });
    T('Non-3DS requires acquirer authorization', n3a.run && n3b.run && !n3c.run, 'Without a recorded acquirer reference 3DS always runs; with one, low-risk non-SCA cards may skip it.');
    const lim = Controls.check({ ...m, limits:{ ...m.limits, perTxnUSD:5000 } }, 10000, 'USD', null, 'card');
    T('Per-transaction limit blocks oversized payments', !!lim && /per-transaction/.test(lim), lim || 'not blocked');
    const sus = Controls.check({ ...m, kyb:'suspended' }, 1000, 'USD', null, 'card');
    T('Suspended merchant cannot take payments', !!sus, sus || 'not blocked');
    const ind = merchant('m_indus'), pk = S.banks.find(b => b.mid==='m_indus' && b.currency==='PKR');
    let pkr=false; try{ Payouts.quote(ind, 'USDT', 10000, pk.id); }catch(e){ pkr = /PKR/.test(e.message); }
    T('Stablecoin → PKR settlement is blocked', pkr, 'Crypto balances cannot be converted to PKR via Soneri Bank without regulatory and bank approval.');
    T('Trial balance after all tests', reconChecks()[0].ok, 'Debits equal credits in every currency.');
  }catch(e){ T('Test harness error', false, e.message); }
  S = JSON.parse(snap);   // tests never leave data behind
  UI.testResults = `<div class="stack">${out.map(t => `<div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><div><b>${esc(t.name)}</b><div class="muted" style="font-size:.84rem">${esc(t.detail)}</div></div>${badge(t.ok?'pass':'fail',t.ok?'pass':'fail')}</div>`).join('<div class="divider"></div>')}</div><p class="faint" style="margin-top:10px">${out.filter(t=>t.ok).length}/${out.length} passed · state restored after the run.</p>`;
  render();
  return out;
}

  async provSim(d){
    const pid = d.id, k = d.k;
    if(!guard('providers.configure')) return;
    const secret = SIM_KEYS[pid] ||= rid(32);
    UI.lastSim ||= {};
    let body, ts, sig;
    if(k==='replay'){ if(!UI.lastSim[pid]) return toast('Send a valid event first, then replay it.','warn'); ({ body, ts, sig } = UI.lastSim[pid]); }
    else {
      body = JSON.stringify({ id:'evt_'+rid(16), provider:pid, type: pid==='soneri'?'payout.status':pid==='acq_sim'?'settlement.report':'payment.notification', created:Date.now() });
      ts = Math.floor(Date.now()/1000) - (k==='stale' ? 900 : 0);
      sig = await hmacHex(secret, `${ts}.${body}`);
      if(k==='valid') UI.lastSim[pid] = { body, ts, sig };
    }
    const sent = k==='forged' ? body.replace('"provider"','"provider_x"') : body;
    const r = await Inbound.handle(sent, `t=${ts},v1=${sig}`, secret);
    const map = { 'processed':['verified','processed'], 'duplicate ignored':['verified','duplicate'], 'signature mismatch':['forged','rejected'], 'timestamp outside replay window':['stale','rejected'] }[r.msg];
    logInbound(pid, JSON.parse(body).type, null, { sig:map[0], result:map[1], http:r.status, note:`Sandbox ${k}: ${r.msg}` });
    audit(ADMIN(),'provider.webhook_sim', pid, `${k} → ${r.status} ${r.msg}`);
    toast(`${prov(pid).name}: HTTP ${r.status} · ${r.msg}`, r.status===200?'':'warn');
    save(); rerender();
  },

  coPayCard(){
    const st = checkoutState(), sess = curSession(); captureDraft();
    const okC = readCustomer();
    const num = (st.cardDraft.num||'').replace(/\s/g,''), exp = st.cardDraft.exp||'', cvc = st.cardDraft.cvc||'';
    if(!/^\d{13,19}$/.test(num) || !luhn(num)) st.errors.num = 'Card number is invalid.';
    else if(!brandOf(num)) st.errors.num = 'This merchant accepts Visa and Mastercard only.';
    const mm = +exp.slice(0,2), yy = +exp.slice(3,5);
    const expEnd = new Date(2000+yy, mm, 1).getTime();
    if(!/^\d{2}\/\d{2}$/.test(exp) || mm<1 || mm>12) st.errors.exp = 'Use MM/YY.'; else if(expEnd <= now()) st.errors.exp = 'This card has expired.';
    if(!/^\d{3,4}$/.test(cvc)) st.errors.cvc = 'Enter the 3-digit security code.';
    if(!okC || st.errors.num || st.errors.exp || st.errors.cvc){ renderWidget(); return; }
    if(!Payments.verifySession(sess, sess.amount, sess.currency)){ st.errors.form='This checkout session expired. Reopen the payment link.'; renderWidget(); return; }
    if(sessionPaid(sess)){ st.errors.form='This checkout is already paid.'; renderWidget(); return; }
    const block = Controls.check(merchant(sess.mid), sess.amount, sess.currency, st.customer, 'card');
    if(block){ raiseAlert('low','control_block', sess.mid, null, block); st.errors.form = block; save(); renderWidget(); return; }
    const tc = CONFIG.testCards[num];

  link(f, fd){ const m = M(), amt = parseMoney(fd.get('amount')), methods = fd.getAll('methods');
    if(!(amt>=50)) throw new Error('Amount must be at least 0.50.'); if(!methods.length) throw new Error('Choose at least one payment method.');
    const desc = fd.get('description').trim(); if(!desc) throw new Error('Add a description.');
    const days = +fd.get('expiry'); const l = { id:id('plink'), slug:rid(22,'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'), mid:m.id, amount:amt, currency:fd.get('currency'), description:desc, methods, reusable:!!fd.get('reusable'), createdAt:now(), expiresAt: days?now()+days*DAY:null, status:'active', payments:[] };
    S.links.unshift(l); audit(ACTOR(),'link.create',l.id, fmt(amt,l.currency)); closeModal(); render(); ACTIONS.shareLink({ id:l.id }); },
  payout(f){ const q = UI.payoutQuote; if(!q) throw new Error('Enter an amount to get a quote.');
    const r = Idem.run(f.dataset.idem, 'payout:'+UI.merchantId, { src:q.sourceCur, amount:q.amount, dest:q.dest.id }, () => Payouts.request(M(), q, ACTOR()));
    const po = r.replay ? S.payouts.find(x => x.id===r.resultId) : r.result;
    closeModal(); toast(r.replay ? 'Duplicate submit ignored — original payout returned (idempotent)' : po.status==='completed'?'Payout sent':'Payout submitted for approval'); },
  poNote(f, fd){ need('payouts.approve'); const po = S.payouts.find(x=>x.id===f.dataset.id), note = fd.get('note').trim(); if(!note) throw new Error('Add a note.'); f.dataset.kind==='hold' ? Payouts.hold(po,ADMIN(),note) : Payouts.reject(po,ADMIN(),note); closeModal(); toast(f.dataset.kind==='hold'?'Payout held':'Payout rejected'); },
  wallet(f, fd){ const m = M(), net = fd.get('network'), addr = fd.get('address').trim(), asset = fd.get('asset');
    if(!CONFIG.networks[net].assets.includes(asset)) throw new Error(`${asset} is not supported on ${CONFIG.networks[net].label}.`);
    if(!validAddress(net, addr)) throw new Error(`That ${net==='BINANCE_PAY'?'Binance Pay ID':'address'} is not valid for ${CONFIG.networks[net].label}.`);
    if(S.wallets.some(w => w.mid===m.id && w.address===addr && w.network===net)) throw new Error('This wallet is already on file.');
    const w = { id:id('wal'), mid:m.id, asset, network:net, address:addr, label:fd.get('label').trim(), status:'pending_verification', addedAt:now(), screening:'pending' };
    S.wallets.push(w); audit(ACTOR(),'wallet.add',w.id); closeModal(); render(); ACTIONS.verifyWallet({ id:w.id }); },
  bank(f, fd){ const m = M(), cur = fd.get('currency'), acct = fd.get('acct').replace(/\s/g,'').toUpperCase();
    if(cur==='PKR'){ if(!validPkIban(acct)) throw new Error('Enter a valid Pakistani IBAN: PK, 2 check digits, 4-letter bank code, 16 digits.'); }
    else if(!/^[A-Z0-9]{6,34}$/.test(acct)) throw new Error('Enter a valid IBAN or account number (6–34 letters or digits).');
    const b = { id:id('bnk'), mid:m.id, currency:cur, bank:fd.get('bank').trim(), holder:fd.get('holder').trim(), last4:acct.slice(-4), status:'pending_review', addedAt:now(), rail: cur==='PKR' ? 'Raast' : '' };
    if(b.holder.toLowerCase()!==m.legal.toLowerCase()) throw new Error('Account holder must match the legal entity name on file.');
    S.banks.push(b); audit(ACTOR(),'bank.add',b.id); closeModal(); toast(cur==='PKR' && mProv(m,'soneri')!=='approved' ? 'Submitted for review. PKR payouts also need Soneri Bank authorization.' : 'Bank account submitted for review'); },
  key(f, fd){ const scopes = fd.getAll('scopes'); if(!scopes.length) throw new Error('Choose at least one permission.'); const nk = issueKey(fd.get('name').trim(), scopes); audit(ACTOR(),'api_key.create',nk.k.id); render(); showSecret(nk); },
  endpoint(f, fd){ const url = fd.get('url').trim(); if(!/^https:\/\/[^\s]+\.[^\s]+/.test(url)) throw new Error('Use a full HTTPS URL.'); let ev = fd.getAll('events'); if(!ev.length) throw new Error('Choose at least one event.'); if(ev.includes('*')) ev=['*'];
    const ep = { id:id('we'), mid:UI.merchantId, url, events:ev, secret:'whsec_'+rid(32), status:'enabled', createdAt:now() }; S.webhooks.push(ep); audit(ACTOR(),'webhook.create',ep.id); closeModal(); render(); ACTIONS.revealSecret({ id:ep.id }); },
  invite(f, fd){ const email = fd.get('email').trim(); if(S.team.some(u => u.email===email)) throw new Error('That person is already on the team.'); S.team.push({ id:id('usr'), mid:UI.merchantId, name:fd.get('name').trim(), email, role:fd.get('role'), mfa:false, lastSeen:null }); audit(ACTOR(),'team.invite',email); closeModal(); toast('Invite sent'); },
  mfa(f, fd){ if(!/^\d{6}$/.test(fd.get('code'))) throw new Error('Enter the 6-digit code.'); M().security.mfa = true; audit(ACTOR(),'security.mfa_enabled',UI.merchantId); closeModal(); toast('Two-factor authentication enabled'); },
};

/* ---------------- 7h. Wiring ---------------- */
document.addEventListener('click', e => {
  const r = e.target.closest('[data-route]');
  if(r){ e.preventDefault(); closeDrawer(); if(r.dataset.tabHint) UI.tabs.mon = r.dataset.tabHint; go(r.dataset.route); return; }
  const a = e.target.closest('[data-act]');
  if(!a || a.matches('input, select, textarea')) return;
  const fn = ACTIONS[a.dataset.act]; if(!fn) return;
  e.preventDefault(); fn(a.dataset, a); save();
});
document.addEventListener('keydown', e => {
  if(e.key==='Enter' && e.target.matches('tr.click')){ e.target.click(); }
  if(e.key==='Escape' && $('#drawerHost .drawer')) closeDrawer();
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if(!f) return; e.preventDefault();
  const fn = FORMS[f.dataset.form]; if(!fn) return;
  const errEl = $('#formErr', f);
  if(errEl) errEl.textContent = '';
  try{ fn(f, new FormData(f)); save(); rerender(); }
  catch(err){ if(errEl) errEl.textContent = err.message; else toast(err.message,'err'); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id==='merchantSel'){ UI.merchantId = t.value; closeDrawer(); render(); return; }
  if(t.id==='adminSel'){ S.actingAdmin = t.value; const u = currentAdmin(); audit(u.email,'staff.session_switch','console'); toast(`Acting as ${u.name} · ${ADMIN_ROLES[u.role].label}${u.mfa?'':' (MFA off — read-only)'}`, u.mfa?'':'warn'); rerender(); return; }
  if(t.dataset.act==='kybCheck'){ try{ need('merchants.kyb'); const m = merchant(t.dataset.id); m.kybChecks[t.dataset.k] = t.checked; audit(ADMIN(),'merchant.kyb_check',m.id,`${t.dataset.k}=${t.checked}`); save(); }catch(err){ t.checked = !t.checked; toast(err.message,'err'); } refreshDrawer(); return; }
  if(t.dataset.act==='planCheck' || t.dataset.act==='goLiveCheck'){ try{ need('providers.configure'); const st = S.providers[t.dataset.p], bag = t.dataset.act==='planCheck' ? st.plan : st.goLive; bag[t.dataset.k] = t.checked; audit(ADMIN(),`provider.${t.dataset.act==='planCheck'?'plan':'golive'}_item`, t.dataset.p, `${t.dataset.k}=${t.checked}`); save(); }catch(err){ t.checked = !t.checked; toast(err.message,'err'); } rerender(); return; }
  if(t.dataset.act==='staffRole'){ try{ need('security.manage'); const u = S.staff.find(x => x.id===t.dataset.id);
      if(u.role==='super_admin' && t.value!=='super_admin' && S.staff.filter(x => x.role==='super_admin' && x.status==='active').length<2) throw new Error('At least one active Super admin must remain.');
      audit(ADMIN(),'staff.role_change',u.email,`${u.role} → ${t.value}`); u.role = t.value; toast(`${u.name}: ${ADMIN_ROLES[u.role].label}`); save(); }catch(err){ toast(err.message,'err'); } rerender(); return; }
  if(t.dataset.filterReport){ UI.filters.report[t.dataset.filterReport] = +t.value; render(); return; }
  if(t.dataset.fbag && t.tagName==='SELECT') return applyFbag(t);
  if(t.dataset.filter || t.dataset.filterAdm) return applyFilter(t);
  if(t.id==='co-net'){ captureDraft(); renderWidget(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if((t.dataset.filter || t.dataset.filterAdm) && t.tagName==='INPUT') applyFilter(t, true);
  if(t.dataset.fbag && t.tagName==='INPUT') applyFbag(t, true);
  if(t.id==='audit-q'){ UI.filters.audit = t.value; clearTimeout(UI.aq); UI.aq = setTimeout(() => { render(); const el=$('#audit-q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 250); }
});
function refocus(idSel){ const el = document.getElementById(idSel); if(el){ el.focus(); el.setSelectionRange?.(el.value.length, el.value.length); } }
function applyFilter(t, keepFocus){
  const bag = t.dataset.filterAdm ? (UI.filters.adm ||= {}) : (UI.filters.pay ||= {});
  bag[t.dataset.filterAdm || t.dataset.filter] = t.value;
  clearTimeout(UI.fq); UI.fq = setTimeout(() => { const idSel = t.id; render(); if(keepFocus) refocus(idSel); }, keepFocus?250:0);
}
function applyFbag(t, keepFocus){
  (UI.filters[t.dataset.fbag] ||= {})[t.dataset.fkey] = t.value;
  clearTimeout(UI.fq); UI.fq = setTimeout(() => { const idSel = t.id; render(); if(keepFocus) refocus(idSel); }, keepFocus?250:0);
}
$$('.roles button').forEach(b => b.addEventListener('click', () => { closeDrawer(); stopTimers(); go(ROLE_DEFAULT[b.dataset.role]); }));
$('#menuBtn').addEventListener('click', () => $('#rail').classList.toggle('open'));
$('#themeBtn').addEventListener('click', () => {
  const root = document.documentElement, cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const next = cur==='dark' ? 'light' : 'dark'; root.setAttribute('data-theme', next); try{ localStorage.setItem('dh.theme', next); }catch{}
});

/* ---------------- Boot ---------------- */
(function boot(){
  try{ const t = localStorage.getItem('dh.theme'); if(t) document.documentElement.setAttribute('data-theme', t); }catch{}
  S = load();
  if(!S) seed();
  if(S.platform?.approvalThresholdUSD!=null) CONFIG.approvalThresholdUSD = S.platform.approvalThresholdUSD;
  UI.merchantId = 'm_northwind';
  const h = (location.hash||'').slice(1);
  const r = routeRole(h) ? h : 'overview';
  UI.role = routeRole(r); UI.route = r;
  render();
  setInterval(() => { const c = $('#clock'); if(c) c.textContent = 'Sim clock · ' + fmtDT(now()) + (S.clockOffsetDays ? ` (+${S.clockOffsetDays}d)` : ''); }, 30000);
})();
</script>
