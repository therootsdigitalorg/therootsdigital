<title>Digital Hub Payments</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — top role bar, left module rail (collapses to a drawer on phones), working canvas.
   Digital Hub identity from the blueprint deck: deep navy ground, teal signal, amber caution. Dark-first. */
:root{
  --bg:#0C172A; --surface:#16253B; --surface-2:#1B2D46; --line:#2B3F57; --line-strong:#394E63;
  --fg:#F5F9FC; --muted:#A8BBCB; --faint:#7F94A8;
  --accent:#25D3B1; --accent-ink:#04261F; --accent-soft:rgba(37,211,177,.13);
  --warn:#FFC25E; --warn-soft:rgba(255,194,94,.14);
  --danger:#FF7D88; --danger-soft:rgba(255,125,136,.14);
  --info:#83BDFF; --info-soft:rgba(131,189,255,.14);
  --ok:#5BDB95; --ok-soft:rgba(91,219,149,.14);
  --neutral-soft:rgba(168,187,203,.14);
  --shadow:0 18px 50px rgba(2,8,20,.55);
  --font-ui:"Aptos","Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F2F6FA; --surface:#FFFFFF; --surface-2:#EAF0F6; --line:#D6E0EA; --line-strong:#B9C8D6;
  --fg:#0C172A; --muted:#45596E; --faint:#5F7387;
  --accent:#0B8F77; --accent-ink:#FFFFFF; --accent-soft:rgba(11,143,119,.10);
  --warn:#8A5A00; --warn-soft:rgba(214,150,30,.16);
  --danger:#B42334; --danger-soft:rgba(180,35,52,.09);
  --info:#1F5FB8; --info-soft:rgba(31,95,184,.09);
  --ok:#17784A; --ok-soft:rgba(23,120,74,.10);
  --neutral-soft:rgba(69,89,110,.09);
  --shadow:0 18px 50px rgba(12,23,42,.16); color-scheme:light }}
:root[data-theme="light"]{
  --bg:#F2F6FA; --surface:#FFFFFF; --surface-2:#EAF0F6; --line:#D6E0EA; --line-strong:#B9C8D6;
  --fg:#0C172A; --muted:#45596E; --faint:#5F7387;
  --accent:#0B8F77; --accent-ink:#FFFFFF; --accent-soft:rgba(11,143,119,.10);
  --warn:#8A5A00; --warn-soft:rgba(214,150,30,.16);
  --danger:#B42334; --danger-soft:rgba(180,35,52,.09);
  --info:#1F5FB8; --info-soft:rgba(31,95,184,.09);
  --ok:#17784A; --ok-soft:rgba(23,120,74,.10);
  --neutral-soft:rgba(69,89,110,.09);
  --shadow:0 18px 50px rgba(12,23,42,.16); color-scheme:light }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:700}
h3{font-size:.98rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}

/* ---------- shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;min-height:58px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.brand-mark{width:6px;height:28px;border-radius:2px;background:var(--accent)}
.brand small{display:block;font-size:.66rem;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.roles{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.roles button{border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.85rem;white-space:nowrap}
.roles button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.topbar .spacer{flex:1}
.sandbox-pill{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);padding:4px 10px;border-radius:999px;white-space:nowrap}
.clock{font-size:.8rem;color:var(--muted)}
.btn.menu-btn{display:none}

.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100% - 58px)}
.rail{border-right:1px solid var(--line);background:var(--surface);padding:16px 10px 30px;position:sticky;top:calc(58px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 58px);overflow:auto}
.rail .ctx{padding:4px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.rail .ctx label{font-size:.7rem;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.rail .ctx select{width:100%;margin-top:6px}
.navgroup{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:600;font-size:.9rem}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .count{font-size:.72rem;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 7px;font-weight:700}
main{min-width:0;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.kpi .label{font-size:.75rem;color:var(--muted);font-weight:600}
.kpi .value{font-size:1.45rem;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:.78rem;color:var(--faint);margin-top:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--fg);border-radius:8px;padding:8px 14px;font-weight:700;font-size:.86rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:var(--danger-soft)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--neutral-soft);color:var(--muted)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.b-danger{background:var(--danger-soft);color:var(--danger)} .b-info{background:var(--info-soft);color:var(--info)}
.b-accent{background:var(--accent-soft);color:var(--accent)}
.tag{font-size:.72rem;font-weight:700;border:1px solid var(--line-strong);border-radius:5px;padding:1px 6px;color:var(--muted);white-space:nowrap}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2);padding:9px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
.empty{padding:28px;text-align:center;color:var(--muted)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.78rem;font-weight:700;color:var(--muted)}
.field small{color:var(--faint);font-size:.75rem}
input[type=text],input[type=email],input[type=number],input[type=url],input[type=password],input[type=date],select,textarea{
  background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.invalid{border-color:var(--danger)!important}
.err{color:var(--danger);font-size:.78rem;font-weight:600}
.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:.88rem}
.check input{margin-top:3px;accent-color:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

.note{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;font-size:.84rem;background:var(--surface-2);display:flex;gap:10px}
.note.warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)}
.note.danger{border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:var(--danger-soft)}
.note.info{border-color:color-mix(in srgb,var(--info) 35%,transparent);background:var(--info-soft)}
.note b{white-space:nowrap}
.kv{display:grid;grid-template-columns:minmax(110px,40%) minmax(0,1fr);gap:7px 12px;font-size:.86rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.divider{height:1px;background:var(--line);margin:4px 0}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding-bottom:12px;position:relative}
.timeline li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:5px}
.timeline li::after{content:"";position:absolute;left:4px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline .t{font-size:.75rem;color:var(--faint)}

/* steps (checkout progress) */
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--accent)}

/* onboarding checklist + permission matrix */
.onb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.onb li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2)}
.onb .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:800;background:var(--line);color:var(--muted)}
.onb .n.done{background:var(--ok-soft);color:var(--ok)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.yes{color:var(--ok);font-weight:800} .no{color:var(--faint)}

/* modal + drawer */
dialog{border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:var(--r-lg);padding:0;box-shadow:var(--shadow);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(4,10,22,.62)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dlg-body{padding:18px;display:flex;flex-direction:column;gap:12px;overflow:auto;max-height:calc(100vh - 170px)}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-foot[hidden]{display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--line-strong);z-index:70;box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none}
.drawer .dlg-body{max-height:none;flex:1}
.scrim{position:fixed;inset:0;background:rgba(4,10,22,.5);z-index:65}
.x{border:0;background:none;color:var(--muted);font-size:1.3rem;cursor:pointer;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{background:var(--surface-2);color:var(--fg)}

.toasts{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--surface-2);border:1px solid var(--line-strong);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);font-size:.86rem;font-weight:600}
.toast.err{border-left-color:var(--danger)} .toast.warn{border-left-color:var(--warn)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-ui)}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* checkout */
.co-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:20px;align-items:start}
.co{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.co-top{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.co-amt{font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.co-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.methods button{border:1px solid var(--line-strong);background:var(--bg);border-radius:10px;padding:12px;cursor:pointer;text-align:left;font-weight:700}
.methods button small{display:block;color:var(--muted);font-weight:500;font-size:.75rem}
.methods button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hosted{border:1px dashed var(--line-strong);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.hosted-label{font-size:.7rem;color:var(--faint);font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.qr{background:#FFFFFF;border-radius:10px;padding:10px;width:176px;height:176px;display:grid;place-items:center;flex:none}
.qr canvas,.qr img{width:156px!important;height:156px!important}
.addr{font-family:var(--font-mono);font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.sim{border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sim h4{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--warn)}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);transition:width .25s}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0}
.result .icon{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;font-weight:800}
.testcards button{display:flex;justify-content:space-between;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;cursor:pointer;gap:8px;text-align:left;font-size:.8rem}
.testcards button:hover{border-color:var(--accent)}

pre.code{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-family:var(--font-mono);font-size:.78rem;margin:0;white-space:pre}
.secret{font-family:var(--font-mono);background:var(--bg);border:1px dashed var(--accent);padding:10px;border-radius:8px;overflow-wrap:anywhere}

@media (max-width:1060px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .split,.co-wrap{grid-template-columns:minmax(0,1fr)} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:0;left:0;bottom:0;width:270px;height:auto;z-index:70;transform:translateX(-100%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:max(10px,env(safe-area-inset-left,0px))}
  .rail.open{transform:none;box-shadow:var(--shadow)}
  .btn.menu-btn{display:inline-flex}
  .clock{display:none}
}
@media (max-width:620px){
  .g2,.g3,.g4,.form-grid{grid-template-columns:minmax(0,1fr)}
  .roles{order:5;width:100%;justify-content:space-between}
  .roles button{flex:1;padding:6px 6px}
  .sandbox-pill{display:none}
  h1{font-size:1.25rem}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:4px}
  .onb li{grid-template-columns:26px minmax(0,1fr)}
  .onb li>:last-child{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="topbar">
  <button class="btn sm menu-btn" id="menuBtn" aria-label="Open navigation">☰</button>
  <div class="brand"><span class="brand-mark"></span><div>DIGITAL HUB<small>Payments · Merchant &amp; Crypto</small></div></div>
  <div class="roles" role="group" aria-label="Switch workspace">
    <button id="role-merchant" data-role="merchant">Merchant</button>
    <button id="role-checkout" data-role="checkout">Checkout</button>
    <button id="role-admin" data-role="admin">Super admin</button>
  </div>
  <span class="spacer"></span>
  <span class="clock num" id="clock"></span>
  <span class="sandbox-pill" title="Every payment, provider and balance on this page is simulated. Real processing is pending backend integration and provider approval.">Sandbox · simulated</span>
  <button class="btn sm ghost" id="themeBtn" aria-label="Toggle light or dark theme">Theme</button>
</header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Modules"></nav>
  <main id="main"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<div id="drawerHost"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
'use strict';
/* ===========================================================================
   DIGITAL HUB — PAYMENTS PROTOTYPE (simulation only, no live provider calls)

   The script is split into layers that map onto the production web app:
     1. CONFIG     → server-side config + provider capability registry
     2. util       → shared helpers. Money is ALWAYS integer minor units.
     3. Store      → persistence (localStorage here → PostgreSQL later)
     4. Ledger     → append-only double-entry journal (ledger_entries table)
     5. Adapters   → CardAcquirer / CryptoProvider / BankPayout interfaces with
                     simulated implementations (swap for real partner SDKs)

async function sha256Hex(text){
  try{ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch{ let h=2166136261; for(const c of text){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return ('fnv'+(h>>>0).toString(16)).padEnd(64,'0'); }
}
async function hmacHex(secret, text){
  try{
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
    const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(text));
    return [...new Uint8Array(sig)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch{ return sha256Hex(secret+'|'+text); }
}

/* ---------------- 4. Ledger (append-only, double-entry) ----------------
   Sign convention: debit = positive, credit = negative. Every journal sums to
   zero per currency. Merchant balances are credit-normal, so balance = −Σ.   */
const Ledger = {
  post(key, lines, meta={}){
    if(S.journalKeys[key]) return false;                 // idempotency: same key never posts twice
    const sums = {};
    for(const l of lines){
      if(!Number.isInteger(l.amt)) throw new Error('Ledger amounts must be integer minor units');
      sums[l.cur] = (sums[l.cur]||0) + l.amt;
    }
    for(const c in sums) if(sums[c]!==0) throw new Error(`Unbalanced journal ${key} (${c} ${sums[c]})`);
    const jid = id('jnl'), at = now();
    S.journalKeys[key] = jid;
    for(const l of lines) if(l.amt!==0) S.ledger.push({ id:id('le'), jid, key, at, acct:l.acct, mid:l.mid||null, cur:l.cur, amt:l.amt, ref:meta.ref||null, memo:meta.memo||'' });
    return jid;
  },
  balance(mid, acct, cur){ let s=0; for(const e of S.ledger) if(e.mid===mid && e.acct===acct && e.cur===cur) s+=e.amt; return -s; },
  merchantBalances(mid){
    const out = {};
    for(const e of S.ledger){
      if(e.mid!==mid || !MERCHANT_ACCTS.includes(e.acct)) continue;
      out[e.cur] ??= { pending:0, available:0, reserve:0, hold:0 };
      const k = {[ACCT.M_PENDING]:'pending',[ACCT.M_AVAIL]:'available',[ACCT.M_RESERVE]:'reserve',[ACCT.M_HOLD]:'hold'}[e.acct];
      out[e.cur][k] -= e.amt;
    }
    return out;
  },
  entriesFor(ref){ return S.ledger.filter(e => e.ref===ref); },
  trialBalance(){
    const t = {};
    for(const e of S.ledger){ t[e.cur] ??= {debits:0, credits:0}; if(e.amt>0) t[e.cur].debits+=e.amt; else t[e.cur].credits-=e.amt; }
    return t;
  },
  accountTotals(){
    const t = {};
    for(const e of S.ledger){ const k = e.acct+'|'+e.cur; t[k] = (t[k]||0) + e.amt; }
    return t;
  },
};

const Webhooks = {
  emit(mid, type, obj){
    const evt = { id:id('evt'), type, created:now(), livemode:false, data:{ object: obj } };
    for(const ep of S.webhooks.filter(w => w.mid===mid && w.status==='enabled' && (w.events.includes('*') || w.events.includes(type)))){
      const d = { id:id('whd'), mid, endpointId:ep.id, url:ep.url, eventId:evt.id, type, at:now(), attempts:0, status:'pending', code:null, signature:'', body:JSON.stringify(evt) };
      S.deliveries.unshift(d);
      this.attempt(d, ep);
    }
    if(S.deliveries.length>300) S.deliveries.length = 300;
  },
  attempt(d, ep){
    d.attempts++; d.lastAttempt = now();
    const ts = Math.floor(now()/1000);
    const fail = /fail|down/i.test(ep.url);
    d.status = fail ? (d.attempts>=5 ? 'failed' : 'retrying') : 'delivered';
    d.code = fail ? 503 : 200;
    d.nextRetry = fail && d.attempts<5 ? now() + Math.pow(2,d.attempts)*60000 : null;
    hmacHex(ep.secret, `${ts}.${d.body}`).then(sig => { d.signature = `t=${ts},v1=${sig}`; });
  },
};

/* ---------------- 5c. Idempotency (Idempotency-Key store) ----------------
   Same key + same parameters → the original result is returned, nothing new
   is created. Same key + different parameters → rejected (HTTP 422).       */
const Idem = {
  run(key, scope, payload, fn){
    if(!key) return { replay:false, result:fn() };
    const fp = scope + '|' + JSON.stringify(payload);
    const hit = S.idem[key];
    if(hit){
      if(hit.fp!==fp) throw new Error('This Idempotency-Key was already used with different parameters (HTTP 422). Start a new request.');
      hit.replays = (hit.replays||0) + 1; hit.lastReplay = now();
      return { replay:true, resultId:hit.resultId };
    }
    const result = fn();
    S.idem[key] = { key, scope, fp, resultId: result?.id || null, at:now(), replays:0 };
    const keys = Object.keys(S.idem); if(keys.length>250) for(const k of keys.sort((a,b)=>S.idem[a].at-S.idem[b].at).slice(0, keys.length-250)) delete S.idem[k];
    return { replay:false, result };
  },
};

function riskScore({ m, amount, currency, card, customer }){
  let s = 8, why = ['base 8'];
  const usd = toUSD(amount, currency);
  if(usd > 50000){ s+=40; why.push('amount > $500 (+40)'); } else if(usd > 20000){ s+=18; why.push('amount > $200 (+18)'); }
  if(card && customer.country && card.country !== customer.country){ s+=22; why.push('card/IP country mismatch (+22)'); }
  const recentDeclines = S.payments.filter(p => p.customer.email===customer.email && p.status==='declined' && now()-p.createdAt < DAY).length;
  if(recentDeclines){ s+=15*recentDeclines; why.push(`${recentDeclines} recent decline(s) (+${15*recentDeclines})`); }
  if(m.risk==='high'){ s+=15; why.push('merchant risk tier high (+15)'); }
  return { score:Math.min(s,99), why };
}

const non3dsAuthorized = m => !!(m.non3dsApproved && m.non3ds?.ref);
function decide3DS({ m, card, amount, currency, risk }){
  const tc = CONFIG.testCards[card.number] || { exemption:true, threeDS:'frictionless' };
  const t = m.threeDS;
  if(t.mode==='always') return { run:true, reason:'Merchant policy: authenticate every card payment.' };
  if(CONFIG.scaCountries.has(card.country)){
    const eur = convert(amount, currency, 'EUR');
    if(t.lowValueExemption && eur < 3000){
      if(tc.exemption) return { run:false, exemption:'low_value', reason:`Low-value exemption requested (${fmt(eur,'EUR')} < €30.00) and accepted by the issuer. SCA region, so the issuer may still step up.` };
      return { run:true, reason:'Low-value exemption requested, issuer soft-declined (1A · authentication required). Stepping up to 3DS.' };
    }
    return { run:true, reason:`${CONFIG.countries[card.country]||card.country} issuer is in an SCA region: 3DS authentication is required.` };
  }
  if(!non3dsAuthorized(m)) return { run:true, reason:'No acquirer authorization for non-3DS is on file for this merchant, so 3DS runs.' };
  if(t.mode==='risk' && risk.score >= t.riskThreshold) return { run:true, reason:`Risk score ${risk.score} ≥ threshold ${t.riskThreshold}: stepping up to 3DS.` };
  return { run:false, exemption:'non_3ds', reason:`Non-3DS ("2D") permitted: ${card.country} issuer outside SCA scope, acquirer approval ${m.non3ds.ref} on file, risk ${risk.score} < ${t.riskThreshold}. Fraud-chargeback liability stays with the merchant.` };
}
/** Merchant controls set by Digital Hub: status, permissions, provider authorization, limits, velocity, geography. */
const Controls = {
  volumeUSD(mid, ms){ return S.payments.filter(p => p.mid===mid && now()-p.createdAt < ms && PAID.includes(p.status)).reduce((s,p) => s + toUSD(p.amount, p.currency), 0); },
  check(m, amount, currency, customer, method){
    if(m.kyb!=='approved') return `${m.name} is not approved to accept payments (status: ${m.kyb}).`;
    if(method==='card'){
      if(!m.perms.card || !m.cardEnabled) return 'Card payments are not enabled for this merchant.';
      if(mProv(m,'acq_sim')!=='approved' || !provOn('acq_sim')) return 'The card acquirer has not authorized this merchant, or card routing is paused.';
    }
    if(method==='crypto'){
      if(!m.perms.crypto) return 'Stablecoin payments are disabled for this merchant by Digital Hub.';
      if(mProv(m, m.cryptoProvider)!=='approved' || !provOn(m.cryptoProvider)) return `${prov(m.cryptoProvider).name} is not authorized for this merchant, or routing is paused.`;
    }
    const usd = toUSD(amount, currency), L = m.limits;
    if(usd > L.perTxnUSD) return `This amount exceeds the merchant's per-transaction limit of ${fmt(L.perTxnUSD,'USD')}.`;
    if(this.volumeUSD(m.id, DAY) + usd > L.dailyUSD) return `The merchant's daily volume limit (${fmt(L.dailyUSD,'USD')}) would be exceeded.`;
    if(this.volumeUSD(m.id, 30*DAY) + usd > L.monthlyUSD) return `The merchant's 30-day volume limit (${fmt(L.monthlyUSD,'USD')}) would be exceeded.`;
    if(customer){
      if(m.controls.blockedCountries.includes(customer.country)) return `Payments from ${CONFIG.countries[customer.country]||customer.country} are not accepted for this merchant.`;
      const n = S.payments.filter(p => p.mid===m.id && p.customer.email===customer.email && now()-p.createdAt < 3600000).length;
      if(n >= m.controls.velocityPerHour) return 'Too many payment attempts from this customer in the last hour. Try again later.';
    }
    return null;
  },
  enforce(m, amount, currency, customer, method){
    const e = this.check(m, amount, currency, customer, method);
    if(e){ raiseAlert('low','control_block', m.id, null, e); throw new Error(e); }
  },
};

/* ---------------- 6d. Payment service ---------------- */
const Payments = {
  /** Server-created checkout session. `sig` binds amount+currency; the client cannot change them. */
  createSession({ mid, amount, currency, description, linkId=null }){
    const m = merchant(mid);
    if(!m) throw new Error('Unknown merchant');
    const sess = { id:id('cs'), mid, amount, currency, description, linkId, createdAt:now(), expiresAt: now()+30*60000, attempts:0 };
    sess.sig = `${sess.id}:${amount}:${currency}:${mid}`;   // stands in for an HMAC created server-side
    S.sessions.unshift(sess); if(S.sessions.length>200) S.sessions.length=200;
    return sess;
  },
  verifySession(sess, clientAmount, clientCurrency){
    return sess.sig === `${sess.id}:${clientAmount}:${clientCurrency}:${sess.mid}` && now() < sess.expiresAt;
  },
  newPayment({ sess, method, customer }){
    const p = { id:id('pay'), mid:sess.mid, sessionId:sess.id, linkId:sess.linkId, method, amount:sess.amount, currency:sess.currency, description:sess.description,
      status:'created', customer, createdAt:now(), events:[], refunded:0, fees:null, net:null, settled:false, card:null, crypto:null, idem:id('idem') };
    addEvent(p, 'created', `Checkout session ${sess.id}`);
    S.payments.unshift(p);
    return p;
  },
  /** Card: authorize (+3DS) then capture according to the merchant's capture mode. */
  cardStart({ sess, card, customer }){
    const m = merchant(sess.mid);
    Controls.enforce(m, sess.amount, sess.currency, customer, 'card');
    const p = this.newPayment({ sess, method:'card', customer });
    const tc = CONFIG.testCards[card.number];
    p.card = { brand: card.brand, last4: card.number.slice(-4), country: card.country, exp: card.exp, bin: card.number.slice(0,6), threeDS:null };
    const risk = riskScore({ m, amount:p.amount, currency:p.currency, card, customer });
    p.risk = risk;
    const d = decide3DS({ m, card, amount:p.amount, currency:p.currency, risk });
    p.card.threeDS = { required:d.run, reason:d.reason, exemption:d.exemption||null };
    if(d.run){
      const flow = tc?.threeDS || 'frictionless';
      if(flow==='challenge'){ p.status='requires_action'; addEvent(p,'requires_action','3DS challenge issued by ACS'); return { p, next:'challenge' }; }
      p.card.threeDS.result = 'authenticated'; p.card.threeDS.flow='frictionless'; p.card.threeDS.eci = card.brand==='Visa'?'05':'02'; p.card.threeDS.liability='issuer';
      addEvent(p,'authenticated','3DS frictionless, ECI '+p.card.threeDS.eci);
    } else {
      p.card.threeDS.result = 'not_performed'; p.card.threeDS.eci = card.brand==='Visa'?'07':'00'; p.card.threeDS.liability='merchant';
      addEvent(p,'3ds_skipped', d.reason);
    }
    return { p, next: this.cardAuthorize(p, card, 'ok') };
  },
  cardComplete3DS(p, card, passed){
    p.card.threeDS.flow='challenge';
    if(!passed){ p.card.threeDS.result='failed'; return this.cardAuthorize(p, card, 'failed'); }
    p.card.threeDS.result='authenticated'; p.card.threeDS.eci = card.brand==='Visa'?'05':'02'; p.card.threeDS.liability='issuer';
    addEvent(p,'authenticated','3DS challenge completed, ECI '+p.card.threeDS.eci);
    return this.cardAuthorize(p, card, 'ok');
  },
  cardAuthorize(p, card, threeDSResult){
    const m = merchant(p.mid), rules = S.platform.risk;
    const r = CardAcquirerSim.authorize({ card, amount:p.amount, currency:p.currency, threeDSResult });
    if(!r.ok){
      p.status='declined'; p.declineCode=r.code; addEvent(p,'declined', r.message);
      logInbound('acq_sim','authorization.declined',p.id);
      Webhooks.emit(p.mid, 'payment.failed', this.public(p));
      if(S.payments.filter(x => x.customer.email===p.customer.email && x.status==='declined' && now()-x.createdAt<DAY).length>=rules.declineCount)
        raiseAlert('medium','card_testing', p.mid, p.id, `${rules.declineCount}+ declines in 24h for ${p.customer.email}`);
      return 'declined';
    }
    p.card.authCode = r.authCode; p.status='authorized'; p.authorizedAt=now(); p.authExpiresAt = now()+7*DAY;
    addEvent(p,'authorized',`Auth code ${r.authCode}`);
    logInbound('acq_sim','authorization.approved',p.id);
    Webhooks.emit(p.mid, 'payment.authorized', this.public(p));
    if(m.captureMode==='auto') this.capture(p, 'system');
    if(toUSD(p.amount,p.currency) > rules.highValueUSD) raiseAlert('medium','high_value', p.mid, p.id, `High-value card payment ${fmt(p.amount,p.currency)}`);
    return p.status;
  },
  capture(p, actor='merchant'){
    if(p.status!=='authorized') throw new Error('Only authorized payments can be captured');
    const m = merchant(p.mid);
    const f = feeQuote(m, 'card', p.amount, p.currency);
    p.fees = { provider:f.provider, platform:f.platform }; p.net = f.net;
    Ledger.post(`${p.id}:capture`, [
      { acct:ACCT.ACQ_RCV, cur:p.currency, amt: p.amount - f.provider },
      { acct:ACCT.M_PENDING, mid:p.mid, cur:p.currency, amt: -f.net },
      { acct:ACCT.P_REV, cur:p.currency, amt: -f.platform },
    ], { ref:p.id, memo:'Card capture (acquirer fee netted)' });
    p.status='captured'; p.capturedAt=now(); p.pendingRemaining=f.net; p.rcvRemaining=p.amount-f.provider;
    addEvent(p,'captured', `Fees ${fmt(f.total,p.currency)} · net ${fmt(f.net,p.currency)} pending T+${CONFIG.cardSettleDays}`);
    Webhooks.emit(p.mid, 'payment.succeeded', this.public(p));
    if(actor!=='system') audit(actor,'payment.capture',p.id);
  },
  cancel(p, actor){
    if(p.status!=='authorized') throw new Error('Only uncaptured authorizations can be canceled');
    p.status='canceled'; addEvent(p,'canceled','Authorization released'); audit(actor,'payment.cancel',p.id);
    Webhooks.emit(p.mid,'payment.canceled', this.public(p));
  },
  /** Crypto: provider creates a payment request with a fixed-rate quote. */
  cryptoStart({ sess, asset, network, customer }){
    const m = merchant(sess.mid);
    Controls.enforce(m, sess.amount, sess.currency, customer, 'crypto');
    if(!CryptoAdapters[m.cryptoProvider].networks.includes(network)) throw new Error(`${CONFIG.networks[network].label} is not offered by ${prov(m.cryptoProvider).name}.`);
    const p = this.newPayment({ sess, method:'crypto', customer });
    const quoteAmount = Math.ceil(sess.amount / CONFIG.fx[sess.currency] * CONFIG.fx[asset]);
    const net = CONFIG.networks[network];
    p.crypto = { provider:m.cryptoProvider, asset, network, address: genAddress(network), quoteAmount, rate: CONFIG.fx[asset]/CONFIG.fx[sess.currency],
      received:0, confirmations:0, required:net.confirmations, expiresAt: now()+CONFIG.quoteMinutes*60000, txHashes:[], excess:0 };
    p.status='awaiting_payment';
    addEvent(p,'awaiting_payment',`Quote ${fmt(quoteAmount,asset)} on ${net.label} via ${prov(m.cryptoProvider).name}, valid ${CONFIG.quoteMinutes} min`);
    Webhooks.emit(p.mid,'crypto.payment_request.created', this.public(p));
    return p;
  },
  /** Called ONLY from a (simulated) verified provider webhook — never from "I have paid". */
  cryptoDetected(p, amount, viaNetwork){
    if(!['awaiting_payment','underpaid'].includes(p.status)) return;
    if(viaNetwork && viaNetwork!==p.crypto.network){
      p.status='wrong_network'; addEvent(p,'wrong_network',`Transfer seen on ${CONFIG.networks[viaNetwork].label}; invoice expects ${CONFIG.networks[p.crypto.network].label}. Funds not credited.`);
      logInbound(p.crypto.provider,'payment.wrong_network',p.id);
      raiseAlert('high','wrong_network',p.mid,p.id,`Customer sent ${fmt(amount,p.crypto.asset)} on the wrong network; manual recovery with provider`);
      Webhooks.emit(p.mid,'crypto.payment.wrong_network', this.public(p));
      return;
    }
    const n = p.crypto.txHashes.length + 1;
    const tx = (CONFIG.networks[p.crypto.network].addr==='evm'?'0x':'') + rid(64,'0123456789abcdef');
    p.crypto.txHashes.push(tx); p.crypto.received += amount; p.crypto.confirmations = 0;
    Ledger.post(`${p.id}:detect:${n}`, [
      { acct:ACCT.P_CUSTODY, cur:p.crypto.asset, amt: amount },
      { acct:ACCT.C_SUSPENSE, mid:p.mid, cur:p.crypto.asset, amt: -amount },
    ], { ref:p.id, memo:'Funds detected, held in suspense until confirmed' });
    p.status='confirming'; addEvent(p,'detected',`${fmt(amount,p.crypto.asset)} detected · tx ${short(tx,8,6)}`);
    logInbound(p.crypto.provider,'payment.detected',p.id);
    Webhooks.emit(p.mid,'crypto.payment.detected', this.public(p));
  },
  cryptoConfirmTick(p){
    if(p.status!=='confirming') return false;
    p.crypto.confirmations = Math.min(p.crypto.required, p.crypto.confirmations + Math.max(1, Math.ceil(p.crypto.required/6)));
    if(p.crypto.confirmations < p.crypto.required) return true;
    const c = p.crypto;
    if(c.received < c.quoteAmount){
      p.status='underpaid'; addEvent(p,'underpaid',`Received ${fmt(c.received,c.asset)} of ${fmt(c.quoteAmount,c.asset)}. Short ${fmt(c.quoteAmount-c.received,c.asset)}.`);
      logInbound(c.provider,'payment.underpaid',p.id);
      raiseAlert('low','underpaid',p.mid,p.id,`Underpaid by ${fmt(c.quoteAmount-c.received,c.asset)}`);
      Webhooks.emit(p.mid,'crypto.payment.underpaid', this.public(p));
      return false;
    }
    this.cryptoCredit(p, c.quoteAmount, c.received - c.quoteAmount, 'Confirmed at required depth');
    return false;
  },
  /** Moves funds out of suspense: invoice share to merchant (net of fees), excess to customer liability. */
  cryptoCredit(p, creditAmount, excess, note){
    const m = merchant(p.mid), c = p.crypto;
    const f = feeQuote(m,'crypto',creditAmount,c.asset);
    Ledger.post(`${p.id}:confirm`, [
      { acct:ACCT.C_SUSPENSE, mid:p.mid, cur:c.asset, amt: creditAmount + excess },
      { acct:ACCT.M_AVAIL, mid:p.mid, cur:c.asset, amt: -f.net },
      { acct:ACCT.P_REV, cur:c.asset, amt: -f.platform },
      { acct:ACCT.P_CUSTODY, cur:c.asset, amt: -f.provider },
      { acct:ACCT.C_OVERPAY, mid:p.mid, cur:c.asset, amt: -excess },
    ], { ref:p.id, memo: excess ? 'Confirmed; excess held for customer refund' : 'Confirmed; provider fee deducted' });
    p.fees = { provider:f.provider, platform:f.platform }; p.net=f.net; p.settled=true; p.creditedAmount=creditAmount;
    c.excess = excess;
    p.status = excess>0 ? 'overpaid' : 'confirmed'; p.confirmedAt = now();
    addEvent(p, p.status, `${note}. Net ${fmt(f.net,c.asset)} available${excess?`; excess ${fmt(excess,c.asset)} refundable to customer`:''}.`);
    logInbound(c.provider,'payment.confirmed',p.id);
    if(excess) raiseAlert('low','overpaid',p.mid,p.id,`Overpaid by ${fmt(excess,c.asset)}; refund excess or confirm with customer`);
    Webhooks.emit(p.mid,'payment.succeeded', this.public(p));
  },
  cryptoExpire(p){
    if(p.status!=='awaiting_payment') return;
    p.status='expired'; addEvent(p,'expired','Quote window closed with no funds received');
    logInbound(p.crypto.provider,'payment.expired',p.id);
    Webhooks.emit(p.mid,'crypto.payment.expired', this.public(p));
  },
  acceptPartial(p, actor){
    if(p.status!=='underpaid') throw new Error('Not underpaid');
    this.cryptoCredit(p, p.crypto.received, 0, 'Merchant accepted partial payment');
    p.status='confirmed'; p.partial=true; audit(actor,'payment.accept_partial',p.id, fmt(p.crypto.received,p.crypto.asset));
  },
  public(p){ return { id:p.id, status:p.status, amount:p.amount, currency:p.currency, method:p.method, net:p.net, refunded:p.refunded, crypto: p.crypto ? { asset:p.crypto.asset, network:p.crypto.network, received:p.crypto.received, provider:p.crypto.provider } : undefined, card: p.card ? { brand:p.card.brand, last4:p.card.last4, three_d_secure:p.card.threeDS?.result } : undefined }; },
};

/* ---------------- 6e. Refunds & disputes ---------------- */
const Refunds = {
  maxRefundable(p){
    if(p.method==='card') return ['captured','settled','partially_refunded'].includes(p.status) ? p.amount - p.refunded : 0;
    if(['confirmed','overpaid','partially_refunded'].includes(p.status)) return (p.creditedAmount ?? 0) - p.refunded;
    return 0;
  },
  /** amount is in payment currency (card) or asset (crypto). */
  create(p, amount, { actor, reason, address, network }){
    const m = merchant(p.mid);
    const rcur = p.method==='card' ? p.currency : p.crypto.asset;
    if(!m.perms.refunds) throw new Error('Refunds are disabled for this merchant by Digital Hub.');
    if(!(amount>0)) throw new Error('Enter a refund amount above zero.');
    if(amount > this.maxRefundable(p)) throw new Error(`The most you can refund is ${fmt(this.maxRefundable(p), rcur)}.`);
    const todayUSD = S.refunds.filter(r => r.mid===p.mid && now()-r.createdAt < DAY).reduce((s,r) => s + toUSD(r.amount, r.cur), 0);
    if(todayUSD + toUSD(amount, rcur) > m.limits.refundDailyUSD) throw new Error(`This refund would exceed the daily refund limit of ${fmt(m.limits.refundDailyUSD,'USD')}. Ask Digital Hub to review.`);
    const n = S.refunds.filter(r => r.paymentId===p.id).length + 1;
    const r = { id:id('re'), paymentId:p.id, mid:p.mid, amount, cur: rcur, reason, createdAt:now(), status:'succeeded', actor };
    if(p.method==='card'){
      if(!p.settled && p.refunded===0 && amount===p.amount){
        // Full refund before settlement → reversal: capture undone, fees not charged.
        const lines = Ledger.entriesFor(p.id).filter(e => e.key===`${p.id}:capture`).map(e => ({ acct:e.acct, mid:e.mid, cur:e.cur, amt:-e.amt }));
        Ledger.post(`${p.id}:reversal`, lines, { ref:p.id, memo:'Reversal before settlement — fees returned' });
        p.refunded = amount; p.status='reversed'; p.pendingRemaining=0; p.rcvRemaining=0; r.kind='reversal';
        addEvent(p,'reversed','Full reversal before settlement; fees not charged');
      } else if(!p.settled){
        if(Ledger.balance(p.mid, ACCT.M_PENDING, p.currency) < amount) throw new Error('Pending balance is too low for this refund.');
        Ledger.post(`${p.id}:refund:${n}`, [
          { acct:ACCT.M_PENDING, mid:p.mid, cur:p.currency, amt: amount },
          { acct:ACCT.ACQ_RCV, cur:p.currency, amt: -amount },
        ], { ref:p.id, memo:'Partial refund before settlement (processing fees retained)' });
        p.pendingRemaining -= amount; p.rcvRemaining -= amount; p.refunded += amount; r.kind='refund';
      } else {
        if(Ledger.balance(p.mid, ACCT.M_AVAIL, p.currency) < amount) throw new Error(`Available ${p.currency} balance is ${fmt(Ledger.balance(p.mid, ACCT.M_AVAIL, p.currency),p.currency)}. Wait for settlements or reduce the amount.`);
        Ledger.post(`${p.id}:refund:${n}`, [
          { acct:ACCT.M_AVAIL, mid:p.mid, cur:p.currency, amt: amount },
          { acct:ACCT.P_CASH, cur:p.currency, amt: -amount },
        ], { ref:p.id, memo:'Refund after settlement (processing fees retained)' });
        p.refunded += amount; r.kind='refund';
      }
    } else {
      const c = p.crypto;
      if(!c.network) throw new Error('Missing network');
      if(!CONFIG.networks[network]) throw new Error('Choose the refund network.');
      if(!validAddress(network, address)) throw new Error(`That ${network==='BINANCE_PAY'?'Binance Pay ID':'address'} is not valid for ${CONFIG.networks[network].label}.`);
      const nf = convert(Math.round(CONFIG.networks[network].payoutFeeUSD*100), 'USD', c.asset);
      if(Ledger.balance(p.mid, ACCT.M_AVAIL, c.asset) < amount + nf) throw new Error(`Available ${c.asset} must cover the refund plus the ${fmt(nf,c.asset)} network fee.`);
      Ledger.post(`${p.id}:refund:${n}`, [
        { acct:ACCT.M_AVAIL, mid:p.mid, cur:c.asset, amt: amount + nf },
        { acct:ACCT.P_CUSTODY, cur:c.asset, amt: -(amount + nf) },
      ], { ref:p.id, memo:`Crypto refund on ${network} incl. network fee` });
      p.refunded += amount; r.networkFee = nf; r.address = address; r.network = network; r.kind='refund'; r.provider = c.provider;
      r.txHash = (CONFIG.networks[network].addr==='evm'?'0x':'') + rid(64,'0123456789abcdef');
      logInbound(c.provider,'refund.completed',p.id);
    }
    if(r.kind==='refund') p.status = (p.refunded >= (p.method==='card'?p.amount:p.creditedAmount)) ? 'refunded' : 'partially_refunded';
    if(r.kind==='refund') addEvent(p, p.status, `Refund ${fmt(amount, r.cur)}${r.networkFee?` + ${fmt(r.networkFee,r.cur)} network fee`:''} · ${reason||'no reason'}`);
    S.refunds.unshift(r);
    audit(actor,'refund.create',p.id, fmt(amount,r.cur));
    Webhooks.emit(p.mid,'refund.succeeded',{ id:r.id, payment:p.id, amount, currency:r.cur });
    return r;
  },
  refundExcess(p, address, network, actor){
    const c = p.crypto;
    if(p.status!=='overpaid' || !c.excess) throw new Error('No excess to refund');
    if(!validAddress(network, address)) throw new Error(`That address is not valid for ${CONFIG.networks[network].label}.`);
    Ledger.post(`${p.id}:excess_refund`, [
      { acct:ACCT.C_OVERPAY, mid:p.mid, cur:c.asset, amt: c.excess },
      { acct:ACCT.P_CUSTODY, cur:c.asset, amt: -c.excess },
    ], { ref:p.id, memo:'Excess returned to customer (network fee deducted from amount sent)' });
    addEvent(p,'confirmed',`Excess ${fmt(c.excess,c.asset)} returned to customer`);
    c.excessRefunded = c.excess; c.excess = 0; p.status='confirmed';
    audit(actor,'payment.refund_excess',p.id);
  },
  refundUnderpaid(p, address, network, actor){
    const c = p.crypto;
    if(p.status!=='underpaid') throw new Error('Not underpaid');
    if(!validAddress(network, address)) throw new Error(`That address is not valid for ${CONFIG.networks[network].label}.`);
    Ledger.post(`${p.id}:suspense_refund`, [
      { acct:ACCT.C_SUSPENSE, mid:p.mid, cur:c.asset, amt: c.received },
      { acct:ACCT.P_CUSTODY, cur:c.asset, amt: -c.received },
    ], { ref:p.id, memo:'Underpayment returned to customer' });
    p.status='refunded'; p.refunded = c.received; addEvent(p,'refunded',`Underpayment of ${fmt(c.received,c.asset)} returned`);
    audit(actor,'payment.refund_underpaid',p.id);
  },
};
const Disputes = {
  open(p, reason){
    if(p.method!=='card' || !p.settled) throw new Error('Only settled card payments can be disputed');
    const m = merchant(p.mid);
    const amt = p.amount - p.refunded, fee = m.fees.disputeFeeUSD ? convert(m.fees.disputeFeeUSD,'USD',p.currency) : 0;
    const d = { id:id('dp'), paymentId:p.id, mid:p.mid, amount:amt, fee, cur:p.currency, reason, status:'needs_response', openedAt:now(), dueAt: now()+7*DAY, liability: p.card.threeDS?.liability };
    Ledger.post(`${d.id}:open`, [
      { acct:ACCT.M_AVAIL, mid:p.mid, cur:p.currency, amt: amt + fee },
      { acct:ACCT.P_CASH, cur:p.currency, amt: -(amt + fee) },
    ], { ref:p.id, memo:`Chargeback ${reason} + dispute fee` });
    p.status='disputed'; addEvent(p,'disputed',`Chargeback opened: ${reason}. ${fmt(amt+fee,p.currency)} debited.`);
    S.disputes.unshift(d);
    logInbound('acq_sim','dispute.opened',p.id);
    raiseAlert('medium','dispute',p.mid,p.id,`Chargeback ${reason} ${fmt(amt,p.currency)}`);
    Webhooks.emit(p.mid,'dispute.created',{ id:d.id, payment:p.id, amount:amt, reason });
    return d;
  },
  submitEvidence(d, text, actor){ d.status='under_review'; d.evidence=text; d.evidenceAt=now(); audit(actor,'dispute.evidence',d.id); },
  resolve(d, won, actor){
    const p = pay(d.paymentId);
    if(won){
      Ledger.post(`${d.id}:won`, [ { acct:ACCT.P_CASH, cur:d.cur, amt:d.amount }, { acct:ACCT.M_AVAIL, mid:d.mid, cur:d.cur, amt:-d.amount } ], { ref:p.id, memo:'Dispute won — amount returned (fee retained)' });
      d.status='won'; p.status = p.refunded ? 'partially_refunded' : 'settled'; addEvent(p,'dispute_won','Funds returned to merchant');
    } else { d.status='lost'; p.status='chargeback_lost'; addEvent(p,'chargeback_lost','Dispute closed in cardholder\'s favour'); }
    audit(actor,`dispute.${d.status}`,d.id);
    Webhooks.emit(d.mid,'dispute.closed',{ id:d.id, status:d.status });
  },
};

/* ---------------- 6f. Settlement (card T+2, reserves) ---------------- */
const Settlement = {
  runCardSettlement(actor='scheduler'){
    let n=0;
    for(const p of S.payments){
      if(p.method!=='card' || p.settled || !['captured','partially_refunded'].includes(p.status)) continue;
      if(now() - p.capturedAt < CONFIG.cardSettleDays*DAY) continue;
      const m = merchant(p.mid);
      const pend = p.pendingRemaining, reserve = pct(pend, m.reserve.pct);
      Ledger.post(`${p.id}:settle`, [
        { acct:ACCT.P_CASH, cur:p.currency, amt: p.rcvRemaining },
        { acct:ACCT.ACQ_RCV, cur:p.currency, amt: -p.rcvRemaining },
        { acct:ACCT.M_PENDING, mid:p.mid, cur:p.currency, amt: pend },
        { acct:ACCT.M_AVAIL, mid:p.mid, cur:p.currency, amt: -(pend - reserve) },
        { acct:ACCT.M_RESERVE, mid:p.mid, cur:p.currency, amt: -reserve },
      ], { ref:p.id, memo:`Acquirer settlement; ${m.reserve.pct}% rolling reserve for ${m.reserve.days}d` });
      p.settled=true; p.settledAt=now(); p.reserve=reserve; p.reserveReleaseAt = now()+m.reserve.days*DAY; p.pendingRemaining=0;
      if(p.status==='captured') p.status='settled';
      addEvent(p,'settled',`${fmt(pend-reserve,p.currency)} available · ${fmt(reserve,p.currency)} reserve until ${fmtDate(p.reserveReleaseAt)}`);
      n++;
    }
    let released=0;
    for(const p of S.payments){
      if(!p.reserve || p.reserveReleased || now() < p.reserveReleaseAt) continue;
      this.releaseOne(p, 'Rolling reserve released'); released++;
    }
    // Authorizations that were never captured expire after 7 days.
    for(const p of S.payments) if(p.status==='authorized' && now() > p.authExpiresAt){ p.status='canceled'; addEvent(p,'canceled','Authorization expired (not captured within 7 days)'); }
    if(n||released) audit(actor,'settlement.card_batch','all',`${n} settled, ${released} reserves released`);
    return { settled:n, released };
  },
  releaseOne(p, memo){
    Ledger.post(`${p.id}:reserve_release`, [
      { acct:ACCT.M_RESERVE, mid:p.mid, cur:p.currency, amt:p.reserve },
      { acct:ACCT.M_AVAIL, mid:p.mid, cur:p.currency, amt:-p.reserve },
    ], { ref:p.id, memo });
    p.reserveReleased=true;
  },
  /** Admin early release of every held reserve for one merchant. */
  releaseEarly(mid, actor){
    let n=0, total={};
    for(const p of S.payments) if(p.mid===mid && p.reserve && !p.reserveReleased){ this.releaseOne(p, 'Reserve released early by Digital Hub'); n++; total[p.currency]=(total[p.currency]||0)+p.reserve; }
    audit(actor,'reserve.release_early',mid, Object.entries(total).map(([c,v])=>fmt(v,c)).join(', ')||'none');
    return n;
  },
};

/* ---------------- 6g. Payouts (conversion quote → approval → send) ---------------- */
const Payouts = {
  destination(m, destId){ return S.wallets.find(w => w.id===destId && w.mid===m.id) || S.banks.find(b => b.id===destId && b.mid===m.id); },
  quote(m, sourceCur, amount, destId){
    if(m.kyb!=='approved') throw new Error('Payouts are blocked until the merchant is approved and active.');
    if(!m.perms.payouts) throw new Error('Payouts are disabled for this merchant by Digital Hub.');
    if(m.settlementHold) throw new Error(`Settlement hold in place: ${m.settlementHold.reason}`);
    const dest = this.destination(m, destId);
    if(!dest) throw new Error('Choose a payout destination.');
    if(dest.status!=='verified') throw new Error('That destination is not verified yet.');
    const destCur = dest.asset || dest.currency;
    if(destCur==='PKR'){
      if(mProv(m,'soneri')!=='approved') throw new Error('PKR settlement via Soneri Bank is not authorized for this merchant yet. Request it under Go-live & providers.');
      if(!provOn('soneri')) throw new Error('Soneri Bank payouts are paused by Digital Hub.');
      if(isCrypto(sourceCur)) throw new Error('Stablecoin → PKR conversion is not offered: it needs SBP / PVARA clearance and bank approval. Settle stablecoins to an approved wallet instead.');
    }
    if(dest.asset && dest.network==='BINANCE_PAY' && mProv(m,'binance')!=='approved') throw new Error('Binance Pay payouts need an approved Binance Pay connection.');
    const spread = sourceCur===destCur ? 0 : m.fees.fxSpreadBps;
    const gross = convert(amount, sourceCur, destCur, spread);
    const fee = dest.asset ? convert(Math.round(CONFIG.networks[dest.network].payoutFeeUSD*100),'USD',destCur) : CONFIG.bankFees[destCur].fee;
    const rate = (CONFIG.fx[destCur]/CONFIG.fx[sourceCur]) * (1 - spread/10000);
    const reasons = [];
    if(dest.asset) reasons.push('Crypto payouts are irreversible');
    if(toUSD(amount, sourceCur) > CONFIG.approvalThresholdUSD*100) reasons.push(`Above ${fmt(CONFIG.approvalThresholdUSD*100,'USD')}`);
    if(m.controls.payoutReviewUSD && toUSD(amount, sourceCur) > m.controls.payoutReviewUSD) reasons.push(`Above merchant review threshold ${fmt(m.controls.payoutReviewUSD,'USD')}`);
    if(m.risk==='high') reasons.push('Merchant risk tier high');
    if(m.security.dualControl) reasons.push('Merchant dual-control setting');
    if(dest.asset && isFiat(sourceCur) && !m.cardToCrypto) throw new Error('Fiat (card) proceeds cannot be paid out as stablecoins for this merchant until the partner approves card-to-crypto settlement.');
    return { sourceCur, amount, destCur, dest, spreadBps:spread, gross, fee, receive: gross - fee, rate, needsApproval: reasons.length>0, reasons, expiresAt: now()+CONFIG.payoutQuoteSeconds*1000 };
  },
  request(m, q, actor){
    if(now() > q.expiresAt) throw new Error('This quote expired. Refresh the quote and confirm again.');
    if(m.settlementHold) throw new Error(`Settlement hold in place: ${m.settlementHold.reason}`);
    if(q.receive <= 0) throw new Error('Amount does not cover the payout fee.');
    const avail = Ledger.balance(m.id, ACCT.M_AVAIL, q.sourceCur);
    if(q.amount > avail) throw new Error(`Only ${fmt(avail,q.sourceCur)} is available.`);
    if(q.amount < m.settlement.minPayout && q.sourceCur===q.destCur) throw new Error(`Minimum payout is ${fmt(m.settlement.minPayout,q.sourceCur)}.`);
    const po = { id:id('po'), mid:m.id, sourceCur:q.sourceCur, amount:q.amount, destCur:q.destCur, destId:q.dest.id, destLabel: q.dest.asset ? `${q.dest.asset} · ${CONFIG.networks[q.dest.network].label} · ${short(q.dest.address,6,4)}` : `${q.dest.bank} ••${q.dest.last4}${q.dest.rail?' · '+q.dest.rail:''}`,
      rate:q.rate, spreadBps:q.spreadBps, fee:q.fee, receive:q.receive, createdAt:now(), status: q.needsApproval ? 'pending_approval' : 'processing', reasons:q.reasons, actor, events:[],
      provider: q.destCur==='PKR' ? 'soneri' : (q.dest.asset ? (q.dest.network==='BINANCE_PAY' ? 'binance' : m.cryptoProvider) : 'acq_sim') };
    Ledger.post(`${po.id}:hold`, [
      { acct:ACCT.M_AVAIL, mid:m.id, cur:q.sourceCur, amt:q.amount },
      { acct:ACCT.M_HOLD, mid:m.id, cur:q.sourceCur, amt:-q.amount },
    ], { ref:po.id, memo:'Payout requested — funds on hold' });
    po.events.push({ at:now(), status:po.status, note: q.needsApproval ? 'Awaiting Digital Hub approval: '+q.reasons.join('; ') : 'Auto-approved' });
    S.payouts.unshift(po);
    audit(actor,'payout.request',po.id, `${fmt(q.amount,q.sourceCur)} → ${fmt(q.receive,q.destCur)}`);
    Webhooks.emit(m.id,'payout.created',{ id:po.id, status:po.status, amount:q.amount, currency:q.sourceCur });
    if(!q.needsApproval) this.send(po, 'system');
    return po;
  },
  approve(po, actor){ if(po.status!=='pending_approval' && po.status!=='held') throw new Error('Not awaiting approval'); if(merchant(po.mid).settlementHold) throw new Error('Release the merchant settlement hold before approving.'); po.events.push({at:now(),status:'approved',note:`Approved by ${actor}`}); audit(actor,'payout.approve',po.id); this.send(po, actor); },
  hold(po, actor, note){ po.status='held'; po.events.push({at:now(),status:'held',note}); audit(actor,'payout.hold',po.id,note); },
  reject(po, actor, note){
    if(!['pending_approval','held'].includes(po.status)) throw new Error('Cannot reject now');
    Ledger.post(`${po.id}:release`, [ { acct:ACCT.M_HOLD, mid:po.mid, cur:po.sourceCur, amt:po.amount }, { acct:ACCT.M_AVAIL, mid:po.mid, cur:po.sourceCur, amt:-po.amount } ], { ref:po.id, memo:'Payout rejected — funds returned to available' });
    po.status='rejected'; po.events.push({at:now(),status:'rejected',note}); audit(actor,'payout.reject',po.id,note);
    Webhooks.emit(po.mid,'payout.failed',{ id:po.id, status:'rejected' });
  },
  send(po, actor){
    po.status='processing';
    Ledger.post(`${po.id}:sent`, [ { acct:ACCT.M_HOLD, mid:po.mid, cur:po.sourceCur, amt:po.amount }, { acct: isCrypto(po.sourceCur)?ACCT.P_CUSTODY:ACCT.P_CASH, cur:po.sourceCur, amt:-po.amount } ], { ref:po.id, memo: po.sourceCur===po.destCur ? 'Payout sent by partner' : `Converted ${po.sourceCur}→${po.destCur} and sent by partner` });
    po.completedAt = now(); po.status='completed';
    const w = S.wallets.find(x=>x.id===po.destId);
    po.reference = isCrypto(po.destCur) ? (w?.network==='BINANCE_PAY' ? 'BPAY'+rid(16,'0123456789') : (w?.network==='TRON'?'':'0x') + rid(64,'0123456789abcdef')) : (po.destCur==='PKR' ? 'RAAST'+rid(12,'0123456789') : 'TRC'+rid(10,'0123456789'));
    po.events.push({at:now(),status:'completed',note:`Partner reference ${short(po.reference,10,6)}`});
    if(po.provider) logInbound(po.provider,'payout.completed',po.id);
    Webhooks.emit(po.mid,'payout.paid',{ id:po.id, amount:po.receive, currency:po.destCur });
  },
};

/* ---------------- 6h. Automatic settlement to preference ---------------- */
function runScheduledPayouts(actor='scheduler', force=false){
  const made = [], skipped = [];
  for(const m of S.merchants){
    if(m.kyb!=='approved' || m.settlement.schedule==='manual') continue;
    if(m.settlementHold){ skipped.push(`${m.name}: settlement hold (${m.settlementHold.reason})`); continue; }
    if(!m.perms.payouts){ skipped.push(`${m.name}: payouts disabled by Digital Hub`); continue; }
    if(m.settlement.schedule==='weekly' && new Date(now()).getDay()!==1 && !force) continue;
    const bal = Ledger.merchantBalances(m.id);
    for(const [cur, b] of Object.entries(bal)){
      if(b.available < m.settlement.minPayout) continue;
      const pref = isCrypto(cur) ? m.settlement.crypto : m.settlement.card;
      if(pref.type==='hold') continue;
      const dest = pref.type==='crypto' ? S.wallets.find(w => w.mid===m.id && w.asset===pref.asset && w.network===pref.network && w.status==='verified')
                                        : S.banks.find(x => x.mid===m.id && x.currency===pref.currency && x.status==='verified');
      if(!dest){ skipped.push(`${m.name} ${cur}: no verified ${pref.type==='crypto'?pref.asset+' wallet on '+pref.network:pref.currency+' bank account'}`); continue; }
      try{ const q = Payouts.quote(m, cur, b.available, dest.id); made.push(Payouts.request(m, q, actor)); }
      catch(e){ skipped.push(`${m.name} ${cur}: ${e.message}`); }
    }
  }
  return { made, skipped };
}

/* ---------------- 6i. Manual ledger adjustments (maker-checker) ---------------- */
const Adjustments = {
  create({ mid, cur, amt, acct, reason }, actor){
    if(!merchant(mid)) throw new Error('Choose a merchant.');
    if(!CONFIG.fx[cur]) throw new Error('Choose a currency.');
    if(!Number.isInteger(amt) || amt===0) throw new Error('Enter a non-zero amount.');
    if(![ACCT.M_AVAIL, ACCT.M_RESERVE].includes(acct)) throw new Error('Adjustments can target available or reserve balances only.');
    if(!reason || reason.length<10) throw new Error('Explain the adjustment (10+ characters) for the audit trail.');
    const a = { id:id('adj'), mid, cur, amt, acct, reason, status:'pending_approval', createdBy:actor, createdAt:now() };
    S.adjustments.unshift(a); audit(actor,'ledger.adjustment_draft',a.id, `${fmt(amt,cur)} ${acct}`);
    return a;
  },
  approve(a, actor){
    if(a.status!=='pending_approval') throw new Error('Adjustment is not awaiting approval.');
    if(a.createdBy===actor) throw new Error('Maker-checker: a different admin must approve this adjustment.');
    Ledger.post(`${a.id}:post`, [ { acct:a.acct, mid:a.mid, cur:a.cur, amt:-a.amt }, { acct:ACCT.P_ADJ, cur:a.cur, amt:a.amt } ], { ref:a.id, memo:`Manual adjustment: ${a.reason}` });
    a.status='posted'; a.approvedBy=actor; a.approvedAt=now(); audit(actor,'ledger.adjustment_post',a.id);
  },
  reject(a, actor){ if(a.status!=='pending_approval') throw new Error('Adjustment is not awaiting approval.'); a.status='rejected'; a.approvedBy=actor; audit(actor,'ledger.adjustment_reject',a.id); },
};

<script>
/* ---------------- 7a. UI helpers ---------------- */
const STATUS_TONE = {
  ok:['settled','confirmed','completed','succeeded','approved','verified','delivered','won','active','paid','enabled','clear','resolved','pass','posted','processed','sandbox_ready','done','connected'],
  accent:['captured'],
  info:['authorized','confirming','processing','awaiting_payment','requires_action','under_review','created','pending_review','pending_verification','acknowledged','evaluation','scheduled','requested','submitted','sandbox','reference_set','provider_review'],
  warn:['pending_approval','partially_refunded','underpaid','overpaid','needs_response','held','retrying','pending','medium','backlog','open','pending_backend','not_configured','duplicate','expiring','on_hold','mfa_off'],
  danger:['declined','failed','wrong_network','disputed','rejected','chargeback_lost','lost','suspended','high','fail','excluded','revoked','blocked','forged','stale'],
};
function badge(status, label){
  const tone = Object.entries(STATUS_TONE).find(([,v]) => v.includes(status))?.[0];
  const cls = tone ? {ok:'b-ok',accent:'b-accent',info:'b-info',warn:'b-warn',danger:'b-danger'}[tone] : '';

}

}

function copyText(text){

function kv(pairs){ return `<dl class="kv">${pairs.filter(Boolean).map(([k,v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`; }
function table(cols, rows, { empty='Nothing here yet.', rowAttr, cls='' } = {}){

}

}
/** Generic filter control: value lands in UI.filters[bag][key]. */
function fInput(bag, key, label, placeholder=''){ const v = UI.filters[bag]?.[key] ?? ''; return `<label class="field"><span>${esc(label)}</span><input type="text" id="f-${bag}-${key}" data-fbag="${bag}" data-fkey="${key}" value="${esc(v)}" placeholder="${esc(placeholder)}"></label>`; }
function fSelect(bag, key, label, opts){ const v = String(UI.filters[bag]?.[key] ?? ''); return `<label class="field"><span>${esc(label)}</span><select id="f-${bag}-${key}" data-fbag="${bag}" data-fkey="${key}">${opts.map(([val,l]) => `<option value="${esc(val)}" ${String(val)===v?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`; }
function methodLabel(p){
  if(p.method==='card') return p.card ? `${esc(p.card.brand)} ••${esc(p.card.last4)}` : 'Card';
  return `${esc(p.crypto.asset)} · ${esc(CONFIG.networks[p.crypto.network].label.split(' (')[0])}`;
}
function qrInto(el, text){
  if(!el) return;
  el.innerHTML='';
  if(window.QRCode){ try{ new QRCode(el, { text, width:156, height:156, colorDark:'#0C172A', colorLight:'#FFFFFF', correctLevel: QRCode.CorrectLevel.M }); return; }catch{} }
  el.innerHTML = '<span style="color:#0C172A;font-size:12px;text-align:center">QR unavailable<br>offline</span>';
}
function usdEq(minor, cur){ return fmt(toUSD(minor,cur),'USD'); }
const payCur = p => p.method==='card' ? p.currency : p.crypto.asset;
const payGross = p => p.method==='card' ? p.amount : (p.creditedAmount ?? p.crypto.received);
const pendingBackend = (what='Real processing') => `<div class="note warn"><b>Pending backend integration</b><span>${esc(what)} needs the server-side integration and written provider approval. Everything here is simulated; no live API is called and no real funds move.</span></div>`;

/* ---------------- 7a-2. Staff RBAC (Super admin workspace) ---------------- */
const PERMS = {
  'merchants.create':'Onboard merchants', 'merchants.kyb':'KYB / KYC / AML decisions', 'merchants.controls':'Permissions, limits & risk controls', 'merchants.pricing':'Merchant pricing & reserves',
  'providers.configure':'Provider configuration', 'providers.authorize':'Merchant provider authorizations', 'destinations.review':'Approve wallets & bank accounts',
  'payouts.approve':'Approve, hold or reject payouts', 'finance.manage':'Settlement holds, reserves & batch runs', 'ledger.adjust.create':'Draft ledger adjustments', 'ledger.adjust.approve':'Approve ledger adjustments',
  'payments.manage':'Disputes & payment exceptions', 'alerts.manage':'Risk alerts & rules', 'platform.settings':'Platform settings & sandbox clock', 'security.manage':'Staff, roles & security policy',
};
const ADMIN_ROLES = {
  super_admin:{ label:'Super admin', perms:Object.keys(PERMS) },
  compliance:{ label:'Compliance', perms:['merchants.create','merchants.kyb','merchants.controls','providers.authorize','destinations.review','alerts.manage'] },
  finance:{ label:'Finance ops', perms:['merchants.pricing','payouts.approve','finance.manage','ledger.adjust.create','ledger.adjust.approve','payments.manage'] },
  risk:{ label:'Risk analyst', perms:['merchants.controls','alerts.manage','payments.manage'] },
  support:{ label:'Support', perms:['payments.manage'] },
  viewer:{ label:'Read-only auditor', perms:[] },
};
function currentAdmin(){ return S.staff.find(u => u.id===S.actingAdmin) || S.staff[0]; }
const ADMIN = () => currentAdmin()?.email || 'admin@digitalhub';
function can(perm){ const u = currentAdmin(); return !!u && u.status==='active' && u.mfa && !!ADMIN_ROLES[u.role]?.perms.includes(perm); }
function need(perm){
  if(can(perm)) return;
  const u = currentAdmin();
  throw new Error(u.status!=='active' ? `${u.name}'s access is disabled.` : !u.mfa ? `${u.name} must enable MFA before privileged actions.` : `${ADMIN_ROLES[u.role].label} role lacks "${PERMS[perm]}". Switch "Acting as" or ask a Super admin.`);
}
function guard(perm){ try{ need(perm); return true; }catch(e){ toast(e.message,'err'); return false; } }

/* ---------------- 7b. Seed data (generated through the real services) ---------------- */
function baseMerchant(o){
  const d = S.platform.defaults;
  return Object.assign({
    kyb:'approved', risk:'low', createdAt: now()-120*DAY, website:'', supportEmail:'', mcc:'5651',
    fees:{ card:{ acqPct:2.2, acqFixedUSD:20, platPct:d.cardPlatPct }, crypto:{ provPct:0.5, platPct:d.cryptoPlatPct }, fxSpreadBps:d.fxSpreadBps, disputeFeeUSD:1500 },
    reserve:{ pct:d.reservePct, days:d.reserveDays }, captureMode:'auto', cardEnabled:true,
    threeDS:{ mode:'risk', riskThreshold:45, lowValueExemption:true },
    non3dsApproved:false, non3ds:null, cardToCrypto:false, cryptoProvider:'bvnk',
    acceptedFiat:['USD'], acceptedCrypto:{},
    settlement:{ card:{type:'fiat',currency:'USD'}, crypto:{type:'crypto',asset:'USDT',network:'TRON'}, schedule:'manual', minPayout:5000 },

    const msg = { pending:'Business verification (KYB) is under review. You can configure the account, but checkout and payouts stay disabled until Digital Hub approves it.',
      rejected:'Business verification was rejected. Contact compliance to resubmit documents.', suspended:'This account is suspended. New payments and payouts are blocked.' }[m.kyb];
    h += `<div class="note warn"><b>${esc(m.kyb.toUpperCase())}</b><span>${msg}</span></div>`;
  }
  if(m.settlementHold) h += `<div class="note danger"><b>SETTLEMENT HOLD</b><span>Digital Hub has paused payouts: ${esc(m.settlementHold.reason)}. Payments still settle into your balance.</span></div>`;
  return h;
}
function dailySeries(pays, days=14){
  const out = []; const end = new Date(now()); end.setHours(23,59,59,999);
  for(let i=days-1;i>=0;i--){
    const dayEnd = end.getTime() - i*DAY, dayStart = dayEnd - DAY + 1;
    let card=0, crypto=0;
    for(const p of pays){ if(p.createdAt<dayStart || p.createdAt>dayEnd || !SUCCESS.includes(p.status)) continue; const v = toUSD(payGross(p), payCur(p)); p.method==='card' ? card+=v : crypto+=v; }
    out.push({ label:new Date(dayEnd).toLocaleDateString('en-US',{month:'short',day:'numeric'}), card, crypto });
  }
  return out;
}
function barChart(series){
  const W=720, H=210, padL=52, padB=26, padT=12, padR=8;
  const max = Math.max(1, ...series.map(s => s.card+s.crypto));
  const step = niceStep(max/100);
  const top = Math.ceil(max/100/step)*step;
  const bw = (W-padL-padR)/series.length;
  const y = v => H-padB - (v/100)/top*(H-padB-padT);
  let g = '';
  for(let t=0;t<=top;t+=step){ const yy=y(t*100); g += `<line x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${yy+3}" text-anchor="end">$${t>=1000?(t/1000)+'k':t}</text>`; }
  series.forEach((s,i) => {
    const x = padL + i*bw + bw*0.18, w = bw*0.64;
    const yc = y(s.card), yk = y(s.card+s.crypto);
    g += `<rect x="${x}" y="${yc}" width="${w}" height="${H-padB-yc}" fill="var(--accent)" rx="2"><title>${s.label}: card ${fmt(s.card,'USD')}</title></rect>`;
    if(s.crypto) g += `<rect x="${x}" y="${yk}" width="${w}" height="${yc-yk}" fill="var(--warn)" rx="2"><title>${s.label}: crypto ${fmt(s.crypto,'USD')}</title></rect>`;
    if(i%2===0 || series.length<=8) g += `<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${s.label}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily successful volume in USD equivalent">${g}</svg></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Card</span><span><i style="background:var(--warn)"></i>USDT / USDC</span><span>USD equivalent at simulated rates</span></div>`;
}
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw/4 || 1))); const f = (raw/4)/p; return (f<1.5?1:f<3.5?2:f<7.5?5:10)*p || 1; }
function balanceCards(mid){
  const bal = Ledger.merchantBalances(mid);
  const curs = Object.keys(bal).sort((a,b) => (isCrypto(a)-isCrypto(b)) || a.localeCompare(b));
  if(!curs.length) return `<div class="card empty">No balances yet. Balances appear after the first successful payment.</div>`;
  return `<div class="grid g4">${curs.map(c => { const b = bal[c]; return `<div class="card kpi">
    <div class="row" style="justify-content:space-between"><span class="label">${c} balance</span>${isCrypto(c)?'<span class="tag">stablecoin</span>':'<span class="tag">fiat</span>'}</div>
    <div class="value">${fmt(b.available,c)}</div><div class="sub">available · ≈ ${usdEq(b.available,c)}</div>
    <div class="divider" style="margin:10px 0"></div>
    ${kv([['Pending',`<span class="num">${fmt(b.pending,c)}</span>`],['Reserve',`<span class="num">${fmt(b.reserve,c)}</span>`],['Payout hold',`<span class="num">${fmt(b.hold,c)}</span>`]])}
  </div>`; }).join('')}</div>`;
}

function filterPayments(all, f){

function paymentFilters(f, all){

    return { title: 'Payment details', body, foot };

}

function reportTable(rows){ return table([{h:'Currency',v:x=>`<b>${x.cur}</b>`},{h:'Payments',r:1,v:x=>x.n},{h:'Gross',r:1,v:x=>fmt(x.gross,x.cur)},{h:'Provider fees',r:1,v:x=>fmt(-x.prov,x.cur)},{h:'Platform fees',r:1,v:x=>fmt(-x.plat,x.cur)},{h:'Refunds',r:1,v:x=>fmt(-x.refunds,x.cur)},{h:'Chargebacks',r:1,v:x=>fmt(-x.disputes,x.cur)},{h:'Net',r:1,v:x=>`<b>${fmt(x.net,x.cur)}</b>`},{h:'≈ USD',r:1,v:x=>usdEq(x.net,x.cur)}], rows, { empty:'No activity in this period.' }); }
function reportRows(mid, since){
  const by = {};
  const get = c => by[c] ||= { cur:c, n:0, gross:0, prov:0, plat:0, refunds:0, disputes:0, net:0 };
  for(const p of S.payments){
    if(mid && p.mid!==mid) continue; if(p.createdAt < since || !p.fees) continue;
    const c = payCur(p), x = get(c);
    if(p.status==='reversed') continue;
    x.n++; x.gross += p.method==='card'?p.amount:p.creditedAmount; x.prov += p.fees.provider; x.plat += p.fees.platform;
  }
  for(const r of S.refunds){ if((mid && r.mid!==mid) || r.createdAt<since || r.kind==='reversal') continue; get(r.cur).refunds += r.amount + (r.networkFee||0); }
  for(const d of S.disputes){ if((mid && d.mid!==mid) || d.openedAt<since) continue; get(d.cur).disputes += d.amount + d.fee - (d.status==='won'?d.amount:0); }
  return Object.values(by).map(x => (x.net = x.gross - x.prov - x.plat - x.refunds - x.disputes, x)).sort((a,b)=>a.cur.localeCompare(b.cur));
}
function methodSplit(mid, since){
  const ok = S.payments.filter(p => (!mid||p.mid===mid) && p.createdAt>=since && SUCCESS.includes(p.status));
  const card = ok.filter(p=>p.method==='card').reduce((s,p)=>s+toUSD(p.amount,p.currency),0), cry = ok.filter(p=>p.method==='crypto').reduce((s,p)=>s+toUSD(p.creditedAmount||0,p.crypto.asset),0);
  const tot = card+cry || 1;
  return `<div class="progress" style="height:12px;display:flex"><div style="width:${card/tot*100}%"></div><div style="width:${cry/tot*100}%;background:var(--warn)"></div></div>
    <div class="legend" style="margin-top:8px"><span><i style="background:var(--accent)"></i>Card ${fmt(card,'USD')} (${Math.round(card/tot*100)}%)</span><span><i style="background:var(--warn)"></i>Stablecoin ${fmt(cry,'USD')} (${Math.round(cry/tot*100)}%)</span></div>`;
}
function authMix(mid, since){
  const cards = S.payments.filter(p => (!mid||p.mid===mid) && p.createdAt>=since && p.card?.threeDS);
  const c = k => cards.filter(p => k(p.card.threeDS)).length;
  return kv([['Frictionless 3DS', c(t=>t.result==='authenticated'&&t.flow!=='challenge')],['Challenge 3DS', c(t=>t.flow==='challenge')],['Non-3DS (2D) / exemption', c(t=>t.result==='not_performed')],['Failed authentication', c(t=>t.result==='failed')],['Card declines', cards.filter(p=>p.status==='declined').length]]);
}
function csvFrom(rows, cols){ const q = v => `"${String(v??'').replace(/"/g,'""')}"`; return [cols.map(c=>q(c[0])).join(','), ...rows.map(r => cols.map(c => q(c[1](r))).join(','))].join('\n'); }

function apiReference(){
  const eps = [['Checkout','POST','/v1/checkout/sessions','Create a hosted checkout session (amount is signed server-side)'],['Checkout','POST','/v1/payment-links','Create a reusable or single-use link'],['Checkout','GET','/v1/payments/{id}','Retrieve payment, status and fees'],
    ['Checkout','POST','/v1/payments/{id}/capture','Capture an authorized card payment'],['Checkout','POST','/v1/refunds','Refund all or part of a payment (Idempotency-Key required)'],
    ['Crypto','POST','/v1/crypto/quotes','Fixed-rate quote for an asset/network pair'],['Crypto','POST','/v1/crypto/payment-requests','Provider-generated address / Binance Pay QR for a quote'],['Crypto','GET','/v1/crypto/payments/{id}','Detection, confirmations and amount received'],
    ['Settlement','POST','/v1/settlements/quotes','Conversion + fee preview for a payout'],['Settlement','POST','/v1/settlements','Request payout to a verified destination (Idempotency-Key required)'],['Settlement','GET','/v1/settlements/{id}','Payout status and partner reference'],
    ['Onboarding','POST','/v1/provider-connections','Request a provider connection (Binance Pay, Coinbase, Soneri, acquirer)'],
    ['Webhooks','POST','/v1/webhook-endpoints','Register an endpoint and receive its signing secret'],['Webhooks','GET','/v1/webhook-deliveries','Delivery log with response codes'],
    ['Inbound','POST','/hooks/binance-pay','Binance Pay notifications (certificate-verified, deduplicated)'],['Inbound','POST','/hooks/coinbase','Coinbase Business notifications (HMAC-verified, deduplicated)'],['Inbound','POST','/hooks/soneri','Soneri Bank payout status callbacks'],['Inbound','POST','/hooks/acquirer','Card acquirer authorization, settlement and dispute events']];
  return pendingBackend('Every endpoint below') + table([{h:'Area',v:e=>esc(e[0])},{h:'Method',v:e=>`<span class="tag">${e[1]}</span>`},{h:'Path',v:e=>`<span class="mono">${esc(e[2])}</span>`},{h:'Purpose',v:e=>esc(e[3])}], eps)
   + `<div class="grid g2"><div class="card"><h3>Create a checkout session</h3><pre class="code" style="margin-top:8px">curl https://api.digitalhub.example/v1/checkout/sessions \\
  -u dh_test_sk_…: \\
  -H "Idempotency-Key: order_2219" \\
  -d amount=12900 -d currency=USD \\
  -d "payment_methods[]=card" \\
  -d "payment_methods[]=crypto" \\
  -d description="Trail running jacket"</pre></div>
  <div class="card"><h3>Verify a webhook (Node)</h3><pre class="code" style="margin-top:8px">const [t, v1] = parse(req.headers['digitalhub-signature']);
const expected = hmacSha256(secret, \`\${t}.\${rawBody}\`);
if (!timingSafeEqual(expected, v1)) return res.sendStatus(400);
if (Date.now()/1000 - t > 300) return res.sendStatus(400); // replay window
if (await seen(event.id)) return res.sendStatus(200);    // dedupe</pre></div></div>`;
}
